---
# Two platforms on purpose. `redis-defaults` pins a copy of the published role
# defaults and tests.yml checks that copy against the defaults file itself, so
# it cannot drift - it covers the passwordless server, the default paths and the
# exporter. `redis-custom` moves every directory, renames the network, sets a
# password and pushes directives through `config`. The shared converge.yml
# includes the role by scenario name, so a second scenario is not an option - a
# scenario is a role name here. `exporter.enabled: false` is covered by
# side_effect.yml rather than a third platform, which would push this
# docker-in-docker run past ~15 minutes.
platforms:
  - name: redis-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: redis-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # redis's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible

    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `redis`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      redis-defaults:
        # A copy of the published defaults, not a variation on them:
        # `overcommit_memory` is the single deliberate difference, because
        # vm.overcommit_memory is not namespaced and setting it here would reach
        # the kernel of whatever machine runs this scenario. tests.yml reads
        # roles/redis/defaults/main.yaml from the controller and asserts every
        # other key still matches, so this copy cannot go stale unnoticed.
        redis:
          image: redis
          version: 8.10-alpine
          password: ""
          network: redis
          config: ""
          overcommit_memory: false
          exporter:
            enabled: true
            image: oliver006/redis_exporter
            version: v1.89.0
          directories:
            ansible: "{{ dir.ansible }}/redis"
            data: "{{ dir.data }}/redis"

        expected_compose_dir: /data/ansible/redis
        expected_data_dir: /data/redis
        expected_conf: /data/ansible/redis/redis.conf
        expected_network: redis
        # what converge rendered, asserted at the top of side_effect.yml
        expected_compose_services: [exporter, redis]
        # and what is left after side_effect.yml turns the exporter off, which is
        # the only state verify ever sees
        expected_compose_services_flipped: [redis]
        # compose names the project after project_src, which is dir.ansible/redis
        # on this host
        expected_container: redis-redis-1
        expected_exporter_container: redis-exporter-1
        expected_exporter_labels:
          prometheus.io.path: /metrics
          prometheus.io.port: "9121"
          prometheus.io.instance: redis-defaults-redis
        expected_mounts:
          - /data/redis:/data
          - /data/ansible/redis/redis.conf:/etc/redis/redis.conf
        # the image this host's client containers are run from - the role
        # already pulled it, so using it costs no extra pull
        expected_image: redis:8.10-alpine
        # unauthenticated PING against a server with no requirepass
        expected_ping: PONG

      redis-custom:
        redis:
          image: redis
          version: 8.10-alpine
          password: molecule-s3cret
          network: redis-cache
          # pushed all the way through: tests.yml asks the running server for
          # maxmemory, so this proves `config` reaches redis and not just a file
          config: |
            maxmemory 32mb
            maxmemory-policy allkeys-lru
          overcommit_memory: false
          # left on with a password set: this is the only host where the
          # exporter has to authenticate, which is where a broken REDIS_PASSWORD
          # would show up as redis_up 0
          exporter:
            enabled: true
            image: oliver006/redis_exporter
            version: v1.89.0
          directories:
            ansible: "{{ dir.ansible }}/redis-cache"
            data: "{{ dir.data }}/redis-cache"

        expected_compose_dir: /data/ansible/redis-cache
        expected_data_dir: /data/redis-cache
        expected_conf: /data/ansible/redis-cache/redis.conf
        expected_network: redis-cache
        expected_compose_services: [exporter, redis]
        # directories.ansible is relocated here, and compose names the project
        # after it - so these names also prove the move actually took effect
        expected_container: redis-cache-redis-1
        expected_exporter_container: redis-cache-exporter-1
        expected_exporter_labels:
          prometheus.io.path: /metrics
          prometheus.io.port: "9121"
          prometheus.io.instance: redis-custom-redis-cache
        expected_mounts:
          - /data/redis-cache:/data
          - /data/ansible/redis-cache/redis.conf:/etc/redis/redis.conf
        expected_image: redis:8.10-alpine
        expected_password: molecule-s3cret
        # what an unauthenticated client gets once requirepass is set
        expected_ping: NOAUTH
        # 32mb, as redis reports it back
        expected_maxmemory: "33554432"
        # the default paths this host must no longer touch
        unexpected_paths:
          - /data/ansible/redis
          - /data/redis
