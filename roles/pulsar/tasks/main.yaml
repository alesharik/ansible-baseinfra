---
- name: Check the pulsar settings
  tags: pulsar
  ansible.builtin.include_tasks: assert.yaml

- name: Create compose dir
  tags: pulsar
  ansible.builtin.file:
    path: "{{ pulsar.directories.ansible }}"
    state: directory
    mode: "0755"

# 10000:0 is the `pulsar` user inside the image, in the root group its own
# directories are group-writable through. The only host directory the broker
# writes to: everything else it keeps is in zookeeper and bookkeeper.
- name: Create the functions worker's download dir
  tags: pulsar
  when: pulsar.functions_worker.enabled
  ansible.builtin.file:
    path: "{{ pulsar.directories.functions }}"
    state: directory
    mode: "0700"
    owner: "10000"
    group: "0"

- name: Move compose files
  tags: pulsar
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ pulsar.directories.ansible }}/docker-compose.yml"
    mode: "0700"
  notify:
    - restart pulsar

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull pulsar image
  tags: pulsar
  community.docker.docker_compose_v2_pull:
    project_src: "{{ pulsar.directories.ansible }}"
    policy: missing

# What the pulsar_init role used to be. It is one command, not a service, so it
# runs as one - the compose project it lived in left an exited container behind
# on every host and restarted it on every converge.
#
# --existing-bk-metadata-service-uri is the load-bearing flag. Without it this
# command *also* initialises BookKeeper's ledger metadata, at its own default
# path, stepping on what the bookkeeper role already owns; with it, the URI is
# recorded and the bookies' ledger metadata is left alone.
#
# It does not stop the command initialising BookKeeper's *stream* metadata - the
# table service's - which it does whenever it finds none, whether or not this
# deployment has a table service. So the container count is passed too, from the
# same var the bookkeeper role initialises it with: left to its own default the
# command would pick 16 where that role picked 8, and whichever ran first would
# silently decide it for good.
#
# Through the docker CLI rather than community.docker.docker_container: that
# module talks to the API through python-requests, which is a library this
# collection otherwise never needs on a target - every other docker task here
# goes through the compose modules, and those shell out to the CLI as this does.
- name: Initialise the cluster metadata
  tags: pulsar
  # One host at a time. The command is safe to repeat, but two hosts racing to
  # create the same znodes of a *fresh* cluster are not.
  throttle: 1
  vars:
    pulsar_id: "{{ pulsar.advertised_ip | default('broker', true) }}"
    # The same networks the broker joins, so this reaches zookeeper.servers the
    # same way the broker will. Repeated --network needs docker 25 or newer; with
    # none listed the container is on the default bridge, which is the case where
    # zookeeper.servers is a routable address rather than a name.
    pulsar_init_networks: >-
      {{ pulsar.networks | default([], true)
         | map('regex_replace', '^', '--network=') | list }}
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'run', '--rm']
         + pulsar_init_networks
         + ['--entrypoint', 'bin/pulsar',
            pulsar.image ~ ':' ~ pulsar.version,
            'initialize-cluster-metadata',
            '--cluster', pulsar.cluster_name,
            '--metadata-store', 'zk:' ~ pulsar.zookeeper.servers,
            '--configuration-metadata-store', 'zk:' ~ pulsar.zookeeper.servers,
            '--web-service-url', 'http://' ~ pulsar_id ~ ':' ~ pulsar.web_port,
            '--broker-service-url', 'pulsar://' ~ pulsar_id ~ ':' ~ pulsar.broker_port,
            '--existing-bk-metadata-service-uri',
            'zk+hierarchical://' ~ pulsar.zookeeper.servers ~ pulsar.bookkeeper.ledgers_path,
            '--initial-num-stream-storage-containers',
            pulsar.bookkeeper.num_storage_containers | string] }}
  register: pulsar_cluster_init
  # Upstream made this command idempotent: run against metadata that is already
  # there it reports the same success rather than failing, which is why it can
  # run on every converge. It reports it in the same words too - the only thing
  # that tells the two apart is that a repeat run says the namespaces it would
  # have created are already there. Both streams, because the command answers
  # through a logger and which one that uses is not this role's to assume.
  changed_when: >-
    'already exists' not in (pulsar_cluster_init.stdout ~ pulsar_cluster_init.stderr)
  failed_when: >-
    pulsar_cluster_init.rc != 0
    or 'setup correctly' not in (pulsar_cluster_init.stdout ~ pulsar_cluster_init.stderr)
  # zookeeper may have only just been started by its own role, which returns as
  # soon as compose does and not when the server is serving.
  retries: 6
  delay: 10
  until: pulsar_cluster_init is not failed

- name: Start pulsar
  tags: pulsar
  community.docker.docker_compose_v2:
    project_src: "{{ pulsar.directories.ansible }}"
    state: present
    remove_orphans: true

- name: Make sure handlers are flushed immediately
  tags: pulsar
  ansible.builtin.meta: flush_handlers
