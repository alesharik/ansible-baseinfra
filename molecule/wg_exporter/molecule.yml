---
# Two platforms on purpose. `wg-exporter-defaults` leaves `wg_exporter` entirely
# alone, so it runs the real role defaults and cannot drift from them.
# `wg-exporter-custom` moves the compose dir off its default and binds a
# different host address and port, so the pair that reaches both the exporter
# flags and the prometheus.io.address label is covered by the same converge. The
# shared converge.yml includes the role by scenario name, so a second scenario is
# not an option - a scenario is a role name here.
#
# There is no side_effect.yml: the service is host-networked, so it has no
# networks and no disable_default_network to flip.
platforms:
  - name: wg-exporter-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: wg-exporter-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # wg_exporter's meta pulls in bootstrap, so this scenario has to satisfy
        # it. `bootstrap` is a plain dict override - it replaces the role
        # defaults wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `wg_exporter`. Deriving the expectation from the same var
    # the template reads would let a broken template agree with a broken test.
    host_vars:
      wg-exporter-defaults:
        # `wg_exporter` is deliberately NOT set: this host runs the role defaults
        # as published, so it cannot pin a stale copy of them. tests.yml re-reads
        # defaults/main.yaml to prove the expectations below still match it.
        expected_compose_dir: /data/ansible/wg-exporter
        expected_image: mindflavor/prometheus-wireguard-exporter
        expected_version: 3.6.6
        expected_listen_address: 127.0.0.1
        expected_port: 9586
        # compose names the project after the basename of project_src. Nothing
        # should ever create this - the only service is host-networked, so it
        # never attaches to a project network and compose creates none.
        unexpected_network: wg-exporter_default
      wg-exporter-custom:
        wg_exporter:
          image: mindflavor/prometheus-wireguard-exporter
          # the only 3.6.x tag published, so this stays on the default - the
          # variation that matters for this role is the bind pair below
          version: 3.6.6
          # 127.0.0.2 rather than 0.0.0.0: still loopback, so the "not reachable
          # off loopback" assertion holds on both hosts, but a template that
          # ignored the var and hardcoded 127.0.0.1 would fail to answer here
          listen_address: 127.0.0.2
          port: 19586
          directories:
            # off the role default, and not a prefix of it. The basename differs
            # too, so the compose project name moves with it.
            ansible: /data/ansible/metrics/wgexp
        expected_compose_dir: /data/ansible/metrics/wgexp
        expected_image: mindflavor/prometheus-wireguard-exporter
        expected_version: 3.6.6
        expected_listen_address: 127.0.0.2
        expected_port: 19586
        unexpected_network: wgexp_default
        # the default path the role must no longer touch on this host
        unexpected_paths:
          - /data/ansible/wg-exporter
