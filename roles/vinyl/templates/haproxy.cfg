#jinja2: trim_blocks: True, lstrip_blocks: True
# Outbound TLS connector for varnish, rendered by the vinyl role.
#
# Varnish cannot originate TLS. This is a single dynamic forwarder: it takes a
# plain-HTTP request over a unix socket, works out where it is going from the
# request itself, and re-originates it over TLS. One listener serves every
# origin, so there is no per-origin configuration to keep in step with the VCL.
#
#   X-Vinyl-Target  hostname or literal IP to connect to   (default: Host)
#   X-Vinyl-Port    origin TLS port                        (default: {{ vinyl.connector.origin_port }})
#   X-Vinyl-Sni     SNI presented to the origin            (default: Host)
#
# All three are stripped before the request leaves here.
global
    log stdout format raw local0 info
    # The image runs as uid 99, which cannot create a socket in the root-owned
    # volume, so compose starts this container as root. These two hand the
    # worker - the process that actually handles traffic - back to an
    # unprivileged user once the socket is bound. The master stays root so it
    # can respawn workers, which is how haproxy master-worker always runs.
    user haproxy
    group haproxy
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    timeout connect {{ vinyl.connector.timeout.connect }}
    timeout client {{ vinyl.connector.timeout.client }}
    timeout server {{ vinyl.connector.timeout.server }}
    timeout http-request 10s

# Whatever docker put in the container's /etc/resolv.conf. On a user-defined
# network that is docker's embedded DNS, which answers for sibling container
# names and forwards public names, so one code path reaches both. Reading the
# file rather than naming 127.0.0.11 keeps this right wherever the container is
# attached - the default bridge gets the host's resolvers instead.
resolvers vinyl
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 1s
    hold other 1s
    hold refused 1s
    hold timeout 1s
    accepted_payload_size 8192

# Unpublished, and exists only so compose has a healthcheck to gate varnish's
# depends_on on: a missing socket is only a warning at VCL load, but a fetch
# against one fails, so varnish must not take traffic before this is up.
frontend health
    bind :8405
    monitor-uri /healthz

frontend outbound
    # 666 because the varnish worker runs under a different uid than this
    # process. The path is inlined here and in vinyl.vcl rather than made a var:
    # it lives inside a volume at a fixed container path and cannot move.
    bind /run/vinyl/connector.sock mode 666

    acl has_target req.hdr(X-Vinyl-Target) -m found
    acl has_port req.hdr(X-Vinyl-Port) -m found
    acl has_sni req.hdr(X-Vinyl-Sni) -m found

    http-request set-var(txn.target) req.hdr(X-Vinyl-Target) if has_target
    http-request set-var(txn.target) req.hdr(host) if !has_target
    http-request return status 400 content-type "text/plain" string "vinyl connector: no target\n" if !{ var(txn.target) -m found }

    http-request set-var(txn.sni) req.hdr(X-Vinyl-Sni) if has_sni
    http-request set-var(txn.sni) req.hdr(host) if !has_sni

    # do-resolve is a DNS resolver and returns nothing for a literal address, so
    # an IP target takes set-dst directly. VCL that pins a backend to an IP is
    # common, and without this branch every such request would 503.
    acl target_is_ip var(txn.target) -m reg ^[0-9]{1,3}(\.[0-9]{1,3}){3}$

    http-request set-dst var(txn.target) if target_is_ip
    http-request do-resolve(txn.dstip,vinyl,ipv4) var(txn.target) if !target_is_ip
    # Without this the request would fall through to `server 0.0.0.0:0` and hang
    # until a timeout instead of failing where the fault actually is.
    http-request return status 503 content-type "text/plain" string "vinyl connector: cannot resolve target\n" if !target_is_ip !{ var(txn.dstip) -m found }
    http-request set-dst var(txn.dstip) if !target_is_ip

    http-request set-dst-port int({{ vinyl.connector.origin_port }})
    http-request set-dst-port req.hdr(X-Vinyl-Port) if has_port

    default_backend origin

backend origin
    http-request del-header X-Vinyl-Target
    http-request del-header X-Vinyl-Port
    http-request del-header X-Vinyl-Sni

    # 0.0.0.0:0 means "whatever set-dst chose". SNI is per-request, so this one
    # server line reaches every origin.
{% if vinyl.connector.verify == 'none' %}
    server clear 0.0.0.0:0 ssl verify none sni var(txn.sni)
{% else %}
    server clear 0.0.0.0:0 ssl verify {{ vinyl.connector.verify }} ca-file {{ vinyl.connector.ca_file }} sni var(txn.sni)
{% endif %}
