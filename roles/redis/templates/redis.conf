#jinja2: trim_blocks: True, lstrip_blocks: True
# Rendered by the alesharik.baseinfra.redis role - edits here are overwritten on
# the next run. Put your own directives in `redis.config` instead.
#
# Only what is named below differs from redis's compiled-in defaults, which are
# the same ones the image runs with when it is given no config file at all.

# The image's WORKDIR and the mount point of redis.directories.data. It is
# inlined rather than templated: the container path is fixed and cannot move.
dir /data
{% if redis.password | length > 0 %}

requirepass {{ redis.password }}
{% endif %}
{% if redis.config | length > 0 %}

# --- redis.config below -----------------------------------------------------
{{ redis.config }}
{% endif %}
