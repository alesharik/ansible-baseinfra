---
# Two platforms on purpose. `docker-registry-defaults` leaves `docker` entirely
# alone, so it runs the real role defaults and cannot drift from them - and it is
# the host that proves the shared-dict fix, see below. `docker-registry-custom`
# moves both directories, adds users, sets `env`, and - via side_effect.yml -
# disables the default network and turns autologin on, so every branch in the
# role is covered by the same converge. The shared converge.yml includes the role
# by scenario name, so a second scenario is not an option - a scenario is a role
# name here.
#
# The defaults host carries a load-bearing assertion that is invisible in
# tests.yml: `docker` is one dict shared with the `docker` role, and ansible
# replaces role defaults rather than merging them. If this role's defaults ever
# stop repeating `registries: {}`, the `docker` role's own "Login into
# registries" task fails on an undefined var - and converge on this host dies
# before verify ever runs.
platforms:
  - name: docker-registry-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: docker-registry-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # the role's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
        # the port the registry listens on inside the container, per
        # REGISTRY_HTTP_ADDR. The role never changes it.
        molecule_registry_port: 80
        # An account written straight into htpasswd by prepare_tasks.yml, named
        # by no host's `users`. The role has to reconcile it away on the first
        # converge - "add the configured users" alone would leave it behind.
        molecule_stale_user: stale
        molecule_stale_password: stale-password
        # every environment line the role sets itself, regardless of `env`
        expected_role_env:
          - "REGISTRY_AUTH=htpasswd"
          - "REGISTRY_AUTH_HTPASSWD_PATH=/htpasswd"
          - "REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm"
          - "REGISTRY_HTTP_ADDR=0.0.0.0:80"
          - "REGISTRY_STORAGE_DELETE_ENABLED=true"
    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `docker`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      docker-registry-defaults:
        # `docker` is deliberately NOT set: this host runs the role defaults as
        # published, so it cannot pin a stale copy of them, and it is what proves
        # `registries: {}` is still in this role's defaults. tests.yml re-reads
        # defaults/main.yaml to prove the expectations below still match it.
        expected_compose_dir: /data/ansible/docker-registry
        expected_data_dir: /data/docker-registry
        expected_image: registry
        expected_version: "2"
        # `users: {}` by default, so htpasswd ends up empty - and the stale
        # account prepare_tasks.yml wrote has to be gone all the same
        expected_users: []
        # nothing to authenticate as on this host; the unauthenticated 401 and
        # the rejected stale account are what cover auth here
        expected_credentials: []
        expected_env: []
        expect_network_mode_none: false
        # compose names the project after the basename of project_src, so this
        # is the network it creates for the role when the flag is off
        expected_networks:
          - docker-registry_default
        expect_autologin: false
      docker-registry-custom:
        docker:
          # owned by the `docker` role. Repeated because `docker` is one dict
          # shared by both roles and ansible replaces rather than merges it -
          # omitting this here breaks the `docker` role's own login task.
          registries: {}
          registry:
            server:
              image: registry
              # off the default, so the tag reaching the running container is
              # visible - the registry logs its own version at startup
              version: "2.8.3"
              users:
                # marked for autologin, so `docker login` runs for this one
                ci:
                  password: ci-password
                  autologin: true
                # autologin explicitly false: the old role logged in any account
                # that merely *defined* the key, so this catches a regression to
                # `selectattr('autologin', 'defined')`
                bot:
                  password: bot-password
                  autologin: false
              # converge leaves this unset so the "no login attempted" branch is
              # covered; side_effect.yml sets it to the running container's
              # address and re-runs the role
              autologin_registry: ~
              # converge runs with the default network on; side_effect.yml flips
              # both of these and re-runs the role, so verify sees the disabled
              # state on this host and the default state on the other
              networks: []
              disable_default_network: false
              # inert as far as auth goes - the assertion is that it reached the
              # container environment alongside the lines the role owns
              env:
                - "REGISTRY_LOG_LEVEL=debug"
              # Both off the role default, and neither a prefix of where the role
              # would otherwise write.
              directories:
                ansible: /data/ansible/registry/srv
                data: /data/registry-storage
        expected_compose_dir: /data/ansible/registry/srv
        expected_data_dir: /data/registry-storage
        expected_image: registry
        expected_version: "2.8.3"
        expected_users:
          - ci
          - bot
        # spelled out rather than read back off docker.registry.server.users:
        # tests.yml authenticates against the running registry with these, and
        # an expectation built from the same var the role hashes would agree
        # with a role that hashed the wrong thing
        expected_credentials:
          - username: ci
            password: ci-password
          - username: bot
            password: bot-password
        expected_env:
          - "REGISTRY_LOG_LEVEL=debug"
        expect_network_mode_none: true
        expected_networks:
          - molecule-docker-registry
        # side_effect.yml creates this network and re-runs the role attached to
        # it; a service on the `none` default network cannot start, so the
        # disabled state is only reachable with an external network to move to.
        # The subnet is pinned so prepare_tasks.yml can mark it insecure before
        # docker is even installed - `docker login` needs that to talk HTTP.
        molecule_external_network: molecule-docker-registry
        molecule_external_subnet: 172.31.200.0/24
        expect_autologin: true
        # which of the accounts above is expected in /root/.docker/config.json.
        # `bot` must not be there: tests.yml asserts the stored auths hold this
        # account and nothing else.
        molecule_autologin_user: ci
        molecule_autologin_password: ci-password
        # the defaults the role must no longer touch on this host
        unexpected_paths:
          - /data/ansible/docker-registry
          - /data/docker-registry
