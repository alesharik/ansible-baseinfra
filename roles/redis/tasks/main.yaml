---
- name: Check the redis settings
  tags: redis
  ansible.builtin.include_tasks: assert.yaml

- name: Create compose dir
  tags: redis
  ansible.builtin.file:
    path: "{{ redis.directories.ansible }}"
    state: directory
    mode: "0755"

# 999:1000 is the `redis` user inside the official image. The entrypoint chowns
# the data dir itself when it has to, but only after walking it - handing it a
# directory that is already right keeps startup off that path entirely.
- name: Create data dir
  tags: redis
  ansible.builtin.file:
    path: "{{ redis.directories.data }}"
    state: directory
    mode: "0700"
    owner: "999"
    group: "1000"

# 0400 owned by the container's own uid, not 0444: this file carries the
# password, so it should not be readable by every user on the host - and it does
# not need to be, because the uid that reads it is known. Getting this wrong is
# quiet: the image's entrypoint would try to chown a read-only bind mount, warn
# twice, and then redis would exit with "can't open config file ... Permission
# denied", which surfaces only as a container that keeps restarting.
- name: Move redis config
  tags: redis
  ansible.builtin.template:
    src: redis.conf
    dest: "{{ redis.directories.ansible }}/redis.conf"
    mode: "0400"
    owner: "999"
    group: "1000"
  notify:
    - restart redis

- name: Move compose files
  tags: redis
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ redis.directories.ansible }}/docker-compose.yml"
    mode: "0700"
  notify:
    - restart redis

- name: Allow memory overcommit
  tags: redis
  when: redis.overcommit_memory
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    sysctl_set: true

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull redis images
  tags: redis
  community.docker.docker_compose_v2_pull:
    project_src: "{{ redis.directories.ansible }}"
    policy: missing

# remove_orphans so that turning the exporter off actually takes its container
# down - without it compose leaves a service it no longer knows about running.
- name: Start redis
  tags: redis
  community.docker.docker_compose_v2:
    project_src: "{{ redis.directories.ansible }}"
    state: present
    remove_orphans: true

- name: Make sure handlers are flushed immediately
  tags: redis
  ansible.builtin.meta: flush_handlers
