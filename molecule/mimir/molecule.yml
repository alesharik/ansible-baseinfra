---
# Two platforms on purpose. `mimir-defaults` leaves `mimir` entirely alone, so it
# runs the real role defaults and cannot drift from them. `mimir-custom` moves
# both directories off their defaults, sets `env` and every tunable the role
# exposes, and - via side_effect.yml - disables the default network, so every
# branch in the templates is covered by the same converge. The shared
# converge.yml includes the role by scenario name, so a second scenario is not
# an option - a scenario is a role name here.
platforms:
  - name: mimir-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: mimir-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # mimir's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
        # the port mimir listens on inside the container, per the rendered config
        molecule_http_port: 9009
    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `mimir`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      mimir-defaults:
        # `mimir` is deliberately NOT set: this host runs the role defaults as
        # published, so it cannot pin a stale copy of them. tests.yml re-reads
        # defaults/main.yaml to prove the expectations below still match it.
        expected_compose_dir: /data/ansible/mimir
        expected_data_dir: /data/mimir
        expected_config_dir: /data/ansible/mimir/config
        expected_log_format: json
        expected_retention: 4w
        expected_ingestion_rate: 50000
        # the template sets the burst to twice the rate, so a host that pinned
        # only the rate would not notice the burst going wrong
        expected_ingestion_burst: 100000
        # `env` defaults to [], so the template must emit no environment key
        expected_env: []
        expect_network_mode_none: false
        # compose names the project after project_src, so this is the network it
        # creates for the role when the flag is off
        expected_networks:
          - mimir_default
      mimir-custom:
        mimir:
          image: grafana/mimir
          version: 2.16.0
          # converge runs with the default network on; side_effect.yml flips
          # both of these and re-runs the role, so verify sees the disabled
          # state on this host and the default state on mimir-defaults
          networks: []
          disable_default_network: false
          # inert on mimir's side - the assertion is that it reached the
          # container environment, not that it changed mimir's behaviour
          env:
            - "MOLECULE_MARKER=mimir-custom"
          log_format: logfmt
          compactor_blocks_retention_period: 2w
          max_ingestion_rate: 25000
          # Both are off the role default, and neither is a prefix of where the
          # role would otherwise write.
          directories:
            ansible: /data/ansible/metrics/mimir
            data: /data/mimir-storage
        expected_compose_dir: /data/ansible/metrics/mimir
        expected_data_dir: /data/mimir-storage
        # not a var of its own - it has to follow the relocated `ansible`, which
        # is only visible because `ansible` is off its default
        expected_config_dir: /data/ansible/metrics/mimir/config
        expected_log_format: logfmt
        expected_retention: 2w
        expected_ingestion_rate: 25000
        expected_ingestion_burst: 50000
        expected_env:
          - "MOLECULE_MARKER=mimir-custom"
        expect_network_mode_none: true
        expected_networks:
          - molecule-mimir
        # side_effect.yml creates this network and re-runs the role attached to
        # it; a service on the `none` default network cannot start, so the
        # disabled state is only reachable with an external network to move to
        molecule_external_network: molecule-mimir
        # paths the role must NOT have touched - the defaults it no longer uses
        unexpected_paths:
          - /data/ansible/mimir
          - /data/mimir
