#jinja2: trim_blocks: True, lstrip_blocks: True
# Managed by ansible (alesharik.baseinfra.postgres). Local edits are overwritten.
#
# The superuser logs in over the socket only. The role reaches that socket from
# the host, through the mounted run directory.
#
# samenet is the docker network of this server. docker-proxy relays some
# connections to a published port - from the host loopback, and IPv6 to an
# IPv4-only network - and those arrive from the gateway, which is in samenet.
#
# TYPE  DATABASE     USER                     ADDRESS                  METHOD
local   all          {{ postgres.username }}                            scram-sha-256
{% if postgres.mode == 'primary' %}
host    replication  replication              {{ postgres.replication.source }}  scram-sha-256
{% endif %}
{% if postgres.exporter.enabled %}
host    postgres     prom-exporter            samenet                  scram-sha-256
{% endif %}
{% for user in postgres.users %}
{% for db in user.privs | default([]) | map(attribute='db') | unique %}
host    {{ db }}  {{ user.name }}  {{ user.ip }}  scram-sha-256
{% endfor %}
{% endfor %}
