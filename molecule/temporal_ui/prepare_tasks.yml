---
# The UI needs a Temporal to point at, and Temporal needs a database. Neither is
# a dependency of the role under test: a running frontend is a service, not a
# role, and an external one is the ordinary case.
- name: Gather facts
  ansible.builtin.setup:

# The fixture below needs docker, and prepare runs before converge - so the
# role that installs it has to be pulled in here. In scenarios whose prepare
# starts by including another role this happens through that role's meta; this
# one deploys a plain compose project, so it is explicit.
- name: Install docker
  ansible.builtin.include_role:
    name: alesharik.baseinfra.docker

- name: Create the fixture database compose dir
  ansible.builtin.file:
    path: "{{ molecule_pg_dir }}"
    state: directory
    mode: "0755"

# On the host network, so the temporal role below reaches it at this instance's
# own address - the shape its own defaults describe.
- name: Write the fixture database compose file
  ansible.builtin.copy:
    dest: "{{ molecule_pg_dir }}/docker-compose.yml"
    mode: "0644"
    content: |
      services:
        postgres:
          image: "{{ molecule_pg_image }}:{{ molecule_pg_version }}"
          restart: unless-stopped
          hostname: postgres
          network_mode: host
          environment:
            POSTGRES_USER: "{{ molecule_pg_user }}"
            POSTGRES_PASSWORD: "{{ molecule_pg_password }}"
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U {{ molecule_pg_user }}"]
            interval: 5s
            timeout: 5s
            retries: 30

- name: Pull the fixture database image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ molecule_pg_dir }}"
    policy: missing

- name: Start the fixture database
  community.docker.docker_compose_v2:
    project_src: "{{ molecule_pg_dir }}"
    state: present

- name: Wait for the fixture database to accept connections
  ansible.builtin.command: >-
    timeout 30 docker exec {{ molecule_pg_container }}
    pg_isready -U {{ molecule_pg_user }}
  register: temporal_ui_prepare_ready
  changed_when: false
  retries: 30
  delay: 5
  until: temporal_ui_prepare_ready.rc == 0

- name: Create the databases the temporal role migrates into
  ansible.builtin.command:
    argv:
      - timeout
      - "30"
      - docker
      - exec
      - "{{ molecule_pg_container }}"
      - psql
      - -U
      - "{{ molecule_pg_user }}"
      - -c
      - "CREATE DATABASE {{ item }};"
  register: temporal_ui_prepare_createdb
  changed_when: "'CREATE DATABASE' in temporal_ui_prepare_createdb.stdout"
  failed_when: >-
    temporal_ui_prepare_createdb.rc != 0
    and 'already exists' not in ((temporal_ui_prepare_createdb.stdout | default(''))
                                 ~ (temporal_ui_prepare_createdb.stderr | default('')))
  loop:
    - "{{ temporal.postgres.database }}"
    - "{{ temporal.postgres.visibility_database }}"

- name: Deploy the temporal server the UI points at
  ansible.builtin.include_role:
    name: alesharik.baseinfra.temporal

# The precondition every assertion after converge rests on. Without it a server
# that never came up would show as the UI's API returning an error, which says
# nothing about the role under test.
- name: Check the temporal server is serving before the UI is deployed
  ansible.builtin.command: >-
    timeout 60 docker run --rm --network {{ temporal.network }}
    {{ temporal.admin_tools.image }}:{{ temporal.admin_tools.version }}
    temporal operator cluster health --address temporal:{{ temporal.grpc_port }}
  register: temporal_ui_prepare_health
  changed_when: false
  retries: 30
  delay: 10
  until: temporal_ui_prepare_health.rc == 0 and 'SERVING' in temporal_ui_prepare_health.stdout
