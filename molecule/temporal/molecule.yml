---
# Two platforms, because the role has two shapes for reaching its database and
# only one of them can be seen per host:
#
#   tm-default  the published defaults. The database is reached by address, on
#               this host's own IP, which is what `postgres.network: ""` means -
#               so the fixture postgres runs on the host network. Metrics on,
#               one namespace, default directories and ports. tests.yml re-reads
#               roles/temporal/defaults/main.yaml from the controller and
#               asserts this host's copy still matches it.
#   tm-moved    the joined-network shape: the fixture postgres has a bridge
#               network of its own and temporal joins it, addressing it by
#               service name. Relocated directories, renamed network, metrics
#               OFF, two namespaces, non-default ports, and `config` and
#               `dynamic_config` entries read back out of the running container
#               - the absent form of every branch tm-default covers.
#
# The database is a plain compose project deployed by prepare_tasks.yml, not the
# `postgres` role: this role's contract is an *external* PostgreSQL, and what is
# under test here is that it migrates into one and talks to it, not how that one
# got there.
platforms:
  - name: tm-default
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: tm-moved
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # temporal's meta pulls in bootstrap, so this scenario has to satisfy
        # it. `bootstrap` is a plain dict override - it replaces the role
        # defaults wholesale, so every key the role reads has to be listed.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          # the prometheus.io.instance label is built from ansible_hostname, so
          # the instances must actually carry their names
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file
            # this container never activated. See molecule/bootstrap.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible

        # The fixture database prepare_tasks.yml deploys. Not the `postgres`
        # role: see the header.
        molecule_pg_image: postgres
        molecule_pg_version: "18.4"
        molecule_pg_user: temporal
        molecule_pg_password: molecule-temporal-pw
        molecule_pg_dir: /data/ansible/molecule-postgres
        # compose names the project after the directory above
        molecule_pg_container: molecule-postgres-postgres-1

        # The workflow the round trip starts. No worker ever picks it up, which
        # is the point: starting it writes through the history store and listing
        # it reads back through the visibility store, so it exercises both
        # databases without needing anything to execute.
        molecule_workflow_type: molecule-probe
        molecule_workflow_queue: molecule-queue

    host_vars:
      tm-default:
        # The fixture runs on the host network here, so the default
        # `postgres.network: ""` / address-based shape is what gets exercised.
        molecule_pg_host_network: true
        molecule_pg_network: ""

        # A copy of the published defaults, except for the three postgres keys a
        # fixture has to supply (password, and the two databases' names are the
        # defaults). tests.yml reads roles/temporal/defaults/main.yaml from the
        # controller and asserts every other key still matches, so this copy
        # cannot go stale unnoticed.
        temporal:
          image: temporalio/server
          version: "1.31.2"
          admin_tools:
            image: temporalio/admin-tools
            version: "1.31.2"
          network: temporal
          advertised_ip: ""
          grpc_port: 7233
          http_port: 7243
          membership:
            broadcast_address: "127.0.0.1"
            frontend_port: 6933
            history_port: 6934
            matching_port: 6935
            worker_port: 6939
          postgres:
            network: ""
            host: "{{ ansible_default_ipv4.address }}"
            port: 5432
            user: temporal
            password: molecule-temporal-pw
            database: temporal
            visibility_database: temporal_visibility
            max_conns: 20
            max_idle_conns: 20
            max_conn_lifetime: 1h
            visibility_max_conns: 10
            visibility_max_idle_conns: 10
            visibility_max_conn_lifetime: 1h
          num_history_shards: 4
          cluster_name: active
          log_level: info
          namespaces:
            - name: default
              retention: 72h
          metrics:
            enabled: true
            port: 8000
          dynamic_config: {}
          config: {}
          directories:
            ansible: "{{ dir.ansible }}/temporal"

        expected_compose_dir: /data/ansible/temporal
        # compose names the project after project_src
        expected_container: temporal-temporal-1
        expected_image: temporalio/server:1.31.2
        expected_network: temporal
        expected_grpc_port: 7233
        expected_http_port: 7243
        expected_broadcast_address: "127.0.0.1"
        expected_num_history_shards: 4
        expected_cluster_name: active
        expected_database: temporal
        expected_visibility_database: temporal_visibility
        expected_metrics_enabled: true
        expected_metrics_port: 8000
        expected_instance_label: tm-default-temporal
        expected_namespaces:
          - default
        expected_mounts:
          - /data/ansible/temporal/temporal.yaml:/etc/temporal/config/temporal.yaml
          - /data/ansible/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml
        # HostIp:HostPort, as `docker inspect` reports it. Nothing published
        # here: advertised_ip is empty, so the server is reachable on its docker
        # network alone.
        expected_ports: []
        expected_config_document: {}
        expected_dynamic_config_keys: []
        # this host asserts its `temporal` dict still matches the role defaults
        expected_matches_defaults: true

      tm-moved:
        # Its own bridge network, joined by the role - the other documented way
        # of reaching the database.
        molecule_pg_host_network: false
        molecule_pg_network: molecule-pg

        temporal:
          image: temporalio/server
          version: "1.31.2"
          admin_tools:
            image: temporalio/admin-tools
            version: "1.31.2"
          # renamed, so what the UI scenario's default() fallback points at is
          # not the only name this ever has
          network: temporal-moved
          advertised_ip: "{{ ansible_default_ipv4.address }}"
          grpc_port: 7333
          http_port: 7343
          membership:
            broadcast_address: "127.0.0.1"
            frontend_port: 6833
            history_port: 6834
            matching_port: 6835
            worker_port: 6839
          postgres:
            network: molecule-pg
            host: postgres
            port: 5432
            user: temporal
            password: molecule-temporal-pw
            database: temporal_moved
            visibility_database: temporal_moved_visibility
            max_conns: 12
            max_idle_conns: 12
            max_conn_lifetime: 30m
            visibility_max_conns: 6
            visibility_max_idle_conns: 6
            visibility_max_conn_lifetime: 30m
          num_history_shards: 8
          cluster_name: molecule
          log_level: warn
          namespaces:
            - name: default
              retention: 24h
            - name: molecule-second
              retention: 48h
          # Off here, which is where the compose template's label branch and the
          # config template's metrics branch are covered in their absent form.
          metrics:
            enabled: false
            port: 8000
          # Pushed all the way through: tests.yml reads both files back out of
          # the running container, so these prove the merge and the dynamic
          # config file reach the server and not just a template.
          dynamic_config:
            limit.maxIDLength:
              - value: 255
          config:
            archival:
              history:
                state: disabled
              visibility:
                state: disabled
          directories:
            ansible: "{{ dir.ansible }}/temporal-moved"

        expected_compose_dir: /data/ansible/temporal-moved
        # directories.ansible is relocated here, and compose names the project
        # after it - so this name also proves the move actually took effect
        expected_container: temporal-moved-temporal-1
        expected_image: temporalio/server:1.31.2
        expected_network: temporal-moved
        expected_grpc_port: 7333
        expected_http_port: 7343
        expected_broadcast_address: "127.0.0.1"
        expected_num_history_shards: 8
        expected_cluster_name: molecule
        expected_database: temporal_moved
        expected_visibility_database: temporal_moved_visibility
        expected_metrics_enabled: false
        expected_metrics_port: 8000
        expected_instance_label: tm-moved-temporal-moved
        expected_namespaces:
          - default
          - molecule-second
        expected_mounts:
          - /data/ansible/temporal-moved/temporal.yaml:/etc/temporal/config/temporal.yaml
          - /data/ansible/temporal-moved/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml
        # HostIp:HostPort, as `docker inspect` reports it - the compose file
        # publishes both on advertised_ip.
        expected_ports:
          - "{{ ansible_default_ipv4.address }}:7333"
          - "{{ ansible_default_ipv4.address }}:7343"
        # read back out of the container's own copy of temporal.yaml
        expected_config_document:
          archival:
            history:
              state: disabled
            visibility:
              state: disabled
        expected_dynamic_config_keys:
          - limit.maxIDLength
        expected_matches_defaults: false
        # the default paths this host must no longer touch
        unexpected_paths:
          - /data/ansible/temporal
