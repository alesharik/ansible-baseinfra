---
# --- defaults have not drifted from what this scenario pins ------------------
# watchtower-defaults deliberately does not set `watchtower` at all, so it runs
# the role defaults as published. The verify play does not include the role, so
# those defaults are not in scope here - the expectations below are spelled out
# in host_vars, and this re-reads the file to prove they still match it.
- name: Read the role defaults from the controller
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/roles/watchtower/defaults/main.yaml"
  delegate_to: localhost
  become: false
  register: role_defaults_raw
  when: inventory_hostname == 'watchtower-defaults'

- name: Check the pinned expectations still equal the role defaults
  vars:
    role_defaults: "{{ role_defaults_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - role_defaults.watchtower.interval == expected_interval
      - role_defaults.watchtower.vmagent
      - not role_defaults.watchtower.disable_default_network
    fail_msg: >-
      roles/watchtower/defaults/main.yaml has changed - the "defaults" host is
      running something else now
  when: inventory_hostname == 'watchtower-defaults'

# --- the compose project landed where directories.ansible points -------------
- name: Stat the compose dir
  ansible.builtin.stat:
    path: "{{ expected_compose_dir }}"
  register: watchtower_compose_dir

- name: Check the compose dir exists
  ansible.builtin.assert:
    that:
      - watchtower_compose_dir.stat.exists
      - watchtower_compose_dir.stat.isdir
    fail_msg: "{{ expected_compose_dir }} is not a directory"

- name: Stat the default path the role must no longer use
  ansible.builtin.stat:
    path: "{{ item }}"
  register: watchtower_defaults_paths
  loop: "{{ unexpected_paths | default([]) }}"

- name: Check the role wrote nothing outside watchtower.directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      {{ item.item }} exists - something in the role still derives its path from
      dir.ansible instead of watchtower.directories
  loop: "{{ watchtower_defaults_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

# --- the bearer token --------------------------------------------------------
- name: Stat the generated token
  ansible.builtin.stat:
    path: "{{ expected_compose_dir }}/http_password"
  register: watchtower_token_file

- name: Read the generated token
  ansible.builtin.slurp:
    src: "{{ expected_compose_dir }}/http_password"
  register: watchtower_token_raw
  no_log: true

- name: Check the token was written next to the compose project
  vars:
    token: "{{ watchtower_token_raw.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - watchtower_token_file.stat.exists
      # 0100: watchtower never reads it, the role hands it over as an env var
      - watchtower_token_file.stat.mode == '0100'
      - token | length == 24
    fail_msg: >-
      http_password is mode {{ watchtower_token_file.stat.mode }} -
      expected 0100 and a 24 character token

# --- docker-compose.yml ------------------------------------------------------
- name: Read the rendered docker-compose.yml
  ansible.builtin.slurp:
    src: "{{ expected_compose_dir }}/docker-compose.yml"
  register: watchtower_compose_raw

- name: Check the token reached the container environment
  vars:
    compose: "{{ watchtower_compose_raw.content | b64decode | from_yaml }}"
    env: "{{ compose.services.watchtower.environment }}"
    token: "{{ watchtower_token_raw.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - compose.services | list == ['watchtower']
      - env.WATCHTOWER_HTTP_API_METRICS == 'true'
      - env.WATCHTOWER_HTTP_API_TOKEN | string == token
      - env.WATCHTOWER_NOTIFICATIONS_HOSTNAME == inventory_hostname
      - compose.services.watchtower.command == '--interval ' ~ expected_interval
    fail_msg: the compose environment does not carry the token that was written to disk

# --- /root/.docker/config.json: mounted only when it is really there ----------
# docker materialises a directory for a missing bind source, and watchtower
# cannot parse a directory as a docker config
- name: Check the docker CLI config is mounted when it exists
  vars:
    compose: "{{ watchtower_compose_raw.content | b64decode | from_yaml }}"
    volumes: "{{ compose.services.watchtower.volumes }}"
  ansible.builtin.assert:
    that:
      - "'/var/run/docker.sock:/var/run/docker.sock' in volumes"
      - "'/root/.docker/config.json:/config.json' in volumes"
    fail_msg: "compose mounts {{ volumes }}"
  when: expect_docker_config_mount

- name: Check the docker CLI config mount is omitted when it is absent
  vars:
    compose: "{{ watchtower_compose_raw.content | b64decode | from_yaml }}"
    volumes: "{{ compose.services.watchtower.volumes }}"
  ansible.builtin.assert:
    that:
      - "'/var/run/docker.sock:/var/run/docker.sock' in volumes"
      - "'/root/.docker/config.json:/config.json' not in volumes"
    fail_msg: >-
      compose mounts {{ volumes }} - docker would create a directory at
      /root/.docker/config.json
  when: not expect_docker_config_mount

- name: Check nothing created a directory at the docker CLI config path
  ansible.builtin.stat:
    path: /root/.docker/config.json
  register: watchtower_docker_config_after

- name: Check the docker CLI config is still a file, or still absent
  ansible.builtin.assert:
    that:
      - not watchtower_docker_config_after.stat.isdir | default(false)
    fail_msg: /root/.docker/config.json is a directory

# --- the vmagent scrape config: dropped only when conf.d exists ---------------
- name: Stat the vmagent scrape config
  ansible.builtin.stat:
    path: "{{ expected_conf_d_dir }}/watchtower.yml"
  register: watchtower_vmagent_conf

- name: Check the scrape config was dropped into the directory vmagent owns
  ansible.builtin.assert:
    that:
      - watchtower_vmagent_conf.stat.exists
    fail_msg: >-
      nothing was written to {{ expected_conf_d_dir }}/watchtower.yml -
      watchtower.directories.vmagent did not follow vmagent.directories.ansible
  when: expect_vmagent_conf

- name: Read the vmagent scrape config
  ansible.builtin.slurp:
    src: "{{ expected_conf_d_dir }}/watchtower.yml"
  register: watchtower_vmagent_conf_raw
  when: expect_vmagent_conf
  no_log: true

# the token is what makes the drop worth anything: vmagent has to scrape with
# the same secret the container was handed
- name: Check the scrape config carries the same token as the container
  vars:
    conf: "{{ watchtower_vmagent_conf_raw.content | b64decode | from_yaml }}"
    job: "{{ conf | selectattr('job_name', 'eq', 'docker-watchtower') | first }}"
    token: "{{ watchtower_token_raw.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - job.metrics_path == '/v1/metrics'
      - job.bearer_token | string == token
    fail_msg: the scrape config does not carry the token the container was given
  when: expect_vmagent_conf

# the skip branch: the role must not fail, and must not conjure the directory
# either - it belongs to the vmagent role, which mounts it into its container
- name: Check nothing was written when conf.d does not exist
  ansible.builtin.assert:
    that:
      - not watchtower_vmagent_conf.stat.exists
    fail_msg: "{{ expected_conf_d_dir }}/watchtower.yml exists but conf.d was never created"
  when: not expect_vmagent_conf

- name: Stat the conf.d directory itself
  ansible.builtin.stat:
    path: "{{ expected_conf_d_dir }}"
  register: watchtower_conf_d_dir
  when: not expect_vmagent_conf

- name: Check the role did not create the vmagent conf.d directory
  ansible.builtin.assert:
    that:
      - not watchtower_conf_d_dir.stat.exists
    fail_msg: >-
      the role created {{ expected_conf_d_dir }} - that directory belongs to the
      vmagent role, which bind-mounts it into its own container
  when: not expect_vmagent_conf

# --- disable_default_network -------------------------------------------------
- name: Check network_mode is set only when the flag is on
  vars:
    compose: "{{ watchtower_compose_raw.content | b64decode | from_yaml }}"
    service: "{{ compose.services.watchtower }}"
  ansible.builtin.assert:
    that:
      - (service.network_mode | default('')) == (expect_network_mode_none | ternary('none', ''))
      # network_mode, not a top-level networks mapping: compose puts a
      # network-scoped alias on every attachment and `none` rejects aliases
      - compose.networks is not defined
    fail_msg: >-
      compose declares network_mode {{ service.network_mode | default('<unset>') }}
      and networks {{ compose.networks | default('<unset>') }}

# --- the container actually runs the config it was handed --------------------
- name: Wait for the watchtower container to report running
  ansible.builtin.command: docker inspect watchtower
  register: watchtower_inspect_raw
  changed_when: false
  retries: 24
  delay: 5
  # `and` short-circuits, so from_json never sees an empty stdout
  until: >-
    watchtower_inspect_raw.rc == 0 and
    (watchtower_inspect_raw.stdout | from_json)[0].State.Running

# the rendered file only proves the template; this proves docker acted on it
- name: Check the container joined the expected networks
  vars:
    nets: "{{ (watchtower_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks | list }}"
  ansible.builtin.assert:
    that:
      - nets == expected_networks
    fail_msg: "container is attached to {{ nets }}, expected {{ expected_networks }}"

- name: Check docker put the container on the none network when the flag is on
  vars:
    host_config: "{{ (watchtower_inspect_raw.stdout | from_json)[0].HostConfig }}"
  ansible.builtin.assert:
    that:
      - host_config.NetworkMode == 'none'
    fail_msg: "container network mode is {{ host_config.NetworkMode }}"
  when: expect_network_mode_none

- name: Check docker mounted the CLI config where it exists
  vars:
    binds: "{{ (watchtower_inspect_raw.stdout | from_json)[0].HostConfig.Binds | default([]) }}"
    # docker appends the access mode, so a bind reads host:container:rw here
    bind_paths: "{{ binds | map('regex_replace', '^([^:]+:[^:]+).*$', '\\1') | list }}"
  ansible.builtin.assert:
    that:
      - "'/root/.docker/config.json:/config.json' in bind_paths"
    fail_msg: "docker bound {{ binds }}"
  when: expect_docker_config_mount

# --- the metrics API answers, and only with the token ------------------------
# not published to the host, so this goes to the container's own address on the
# project network. With disable_default_network the container has no address at
# all, which is the documented trade-off - nothing to reach there.
- name: Read the container address on the project network
  vars:
    networks: "{{ (watchtower_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks }}"
  ansible.builtin.set_fact:
    watchtower_ip: "{{ networks[expected_networks[0]].IPAddress }}"
  when: not expect_network_mode_none

- name: Request the metrics API without the token
  ansible.builtin.uri:
    url: "http://{{ watchtower_ip }}:{{ molecule_api_port }}/v1/metrics"
    status_code: 401
  register: watchtower_unauthed
  retries: 24
  delay: 5
  until: watchtower_unauthed.status is defined and watchtower_unauthed.status == 401
  when: not expect_network_mode_none

- name: Request the metrics API with the token
  ansible.builtin.uri:
    url: "http://{{ watchtower_ip }}:{{ molecule_api_port }}/v1/metrics"
    headers:
      Authorization: "Bearer {{ watchtower_token_raw.content | b64decode }}"
    return_content: true
  register: watchtower_metrics
  when: not expect_network_mode_none
  no_log: true

- name: Check the API served prometheus metrics
  ansible.builtin.assert:
    that:
      - "'watchtower_containers_scanned' in watchtower_metrics.content"
    fail_msg: the metrics API answered without watchtower's own metrics in it
  when: not expect_network_mode_none
