---
- name: Check the zookeeper settings
  tags: zookeeper
  ansible.builtin.include_tasks: assert.yaml

- name: Look for a myid this server was already started with
  tags: zookeeper
  ansible.builtin.stat:
    path: "{{ zookeeper.directories.data }}/myid"
  register: zookeeper_myid

- name: Read the existing myid
  tags: zookeeper
  when: zookeeper_myid.stat.exists
  ansible.builtin.slurp:
    src: "{{ zookeeper.directories.data }}/myid"
  register: zookeeper_myid_raw

# The entrypoint writes myid only when the file is absent, so on a server that
# has already run once a changed zookeeper.id would be ignored: the container
# would keep its old identity while every other member addressed it by the new
# one. Nothing about that is visible in the role's output, which is why it is an
# error rather than a rewrite - renumbering a live member is a data-directory
# decision, not a template one.
- name: Check the existing myid still agrees with zookeeper.id
  tags: zookeeper
  when: zookeeper_myid.stat.exists
  vars:
    zookeeper_myid_on_disk: "{{ zookeeper_myid_raw.content | b64decode | trim }}"
  ansible.builtin.assert:
    that:
      - zookeeper_myid_on_disk == zookeeper.id | string
    fail_msg: >-
      {{ zookeeper.directories.data }}/myid holds {{ zookeeper_myid_on_disk }} but
      zookeeper.id is {{ zookeeper.id }}. The image writes myid only when it is
      missing, so this server would keep identity {{ zookeeper_myid_on_disk }}.
      Either put zookeeper.id back, or remove the data directory to rebuild this
      member from the rest of the ensemble.

- name: Create compose dir
  tags: zookeeper
  ansible.builtin.file:
    path: "{{ zookeeper.directories.ansible }}"
    state: directory
    mode: "0755"

# 1000:1000 is the `zookeeper` user inside the official image. Handing it
# directories that are already right is what lets the container run as that user
# from the start: the entrypoint's first branch only chowns them - recursively,
# over the whole snapshot directory - when it is entered as root.
- name: Create the dirs the server writes to
  tags: zookeeper
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "1000"
    group: "1000"
  loop:
    - "{{ zookeeper.directories.data }}"
    - "{{ zookeeper.directories.datalog }}"
    - "{{ zookeeper.directories.logs }}"

- name: Move compose files
  tags: zookeeper
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ zookeeper.directories.ansible }}/docker-compose.yml"
    mode: "0700"
  notify:
    - restart zookeeper

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull zookeeper image
  tags: zookeeper
  community.docker.docker_compose_v2_pull:
    project_src: "{{ zookeeper.directories.ansible }}"
    policy: missing

- name: Start zookeeper
  tags: zookeeper
  community.docker.docker_compose_v2:
    project_src: "{{ zookeeper.directories.ansible }}"
    state: present
    remove_orphans: true

- name: Make sure handlers are flushed immediately
  tags: zookeeper
  ansible.builtin.meta: flush_handlers
