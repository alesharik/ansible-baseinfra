---
- name: Create compose dir
  ansible.builtin.file:
    path: "{{ loki.directories.ansible }}"
    state: directory
    mode: "0755"
  tags: loki
- name: Create data dir
  ansible.builtin.file:
    path: "{{ loki.directories.data }}"
    state: directory
    mode: "0755"
    owner: '10001'
  tags: loki
- name: Move compose files
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ loki.directories.ansible }}/docker-compose.yml"
    mode: "0755"
  tags: loki
  notify:
    - restart loki
- name: Make config folder
  ansible.builtin.file:
    path: "{{ loki.directories.ansible }}/config"
    state: directory
    mode: "0755"
  tags: loki
- name: Move config
  ansible.builtin.template:
    src: config.yaml
    dest: "{{ loki.directories.ansible }}/config/config.yaml"
    mode: "0755"
  tags: loki
  notify:
    - restart loki

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull loki images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ loki.directories.ansible }}"
    policy: missing
  tags: loki

- name: Start loki
  community.docker.docker_compose_v2:
    project_src: "{{ loki.directories.ansible }}"
    state: present
  tags: loki

- name: Make sure handlers are flushed immediately
  ansible.builtin.meta: flush_handlers
  tags: loki
