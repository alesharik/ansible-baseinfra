- job_name: "docker-etcd-{{ etcd.directories.ansible | basename }}"
  scrape_interval: 5s
  metrics_path: /metrics
  docker_sd_configs:
    - host: unix:///var/run/docker.sock
  relabel_configs:
    - target_label: __scheme__
      replacement: https
    - source_labels: [__meta_docker_container_name]
      regex: "/{{ etcd.directories.ansible | basename }}-etcd-.+"
      action: keep

    - source_labels: [ __address__, __meta_docker_container_label_prometheus_io_port ]
      action: replace
      target_label: __address__
      regex: (.+)(?::\d+);(\d+)
      replacement: $1:$2
    - source_labels: [ __meta_docker_container_label_prometheus_io_instance ]
      regex: (.+)
      target_label: instance
    - action: keep_if_contains
      source_labels: [ __meta_docker_container_label_prometheus_io_network ]
      target_label: __meta_docker_network_name
    - action: labeldrop
      regex: (io_password|io_path|io_port|io_username|io_network)
    - regex: __meta_docker_container_name
      action: labelmap
      replacement: container_name
  tls_config:
    insecure_skip_verify: true
    cert_file: "/etc/vmagent/conf.d/etcd-{{ etcd.directories.ansible | basename }}.cer"
    key_file: "/etc/vmagent/conf.d/etcd-{{ etcd.directories.ansible | basename }}.key"
    ca_file: "/etc/vmagent/conf.d/etcd-{{ etcd.directories.ansible | basename }}-ca.cer"