---
# Two platforms on purpose. `loki-defaults` leaves `loki` entirely alone, so it
# runs the real role defaults and cannot drift from them. `loki-custom` moves
# both directories off their defaults, sets `env`, turns on the v11 schema
# migration and - via side_effect.yml - disables the default network, so every
# branch in the templates is covered by the same converge. The shared
# converge.yml includes the role by scenario name, so a second scenario is not
# an option - a scenario is a role name here.
platforms:
  - name: loki-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: loki-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # loki's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
        # the port loki listens on inside the container, per the rendered config
        molecule_http_port: 3100
    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `loki`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      loki-defaults:
        # `loki` is deliberately NOT set: this host runs the role defaults as
        # published, so it cannot pin a stale copy of them. tests.yml re-reads
        # defaults/main.yaml to prove the expectations below still match it.
        expected_compose_dir: /data/ansible/loki
        expected_data_dir: /data/loki
        expected_config_dir: /data/ansible/loki/config
        expected_log_format: json
        expected_retention_period: 30d
        expected_retention_stream:
          - selector: '{container_name="nginx-proxy"}'
            priority: 1
            period: 24h
        expected_allow_structured_metadata: true
        # migrate_from_v11 is off by default, so only the v13 period is written
        expected_schemas:
          - v13
        expected_schema_from:
          - "2024-07-06"
        # `env` defaults to [], so the template must emit no environment key
        expected_env: []
        expect_network_mode_none: false
        # compose names the project after project_src, so this is the network it
        # creates for the role when the flag is off
        expected_networks:
          - loki_default
      loki-custom:
        loki:
          image: grafana/loki
          version: 3.5
          # converge runs with the default network on; side_effect.yml flips
          # both of these and re-runs the role, so verify sees the disabled
          # state on this host and the default state on loki-defaults
          networks: []
          disable_default_network: false
          # inert on loki's side - the assertion is that it reached the
          # container environment, not that it changed loki's behaviour
          env:
            - "MOLECULE_MARKER=loki-custom"
          allow_structured_metadata: false
          log_format: logfmt
          retention:
            retention_period: 14d
            # loki rejects anything under 24h here, so this is 72h rather than
            # something arbitrarily small - it still differs from the default
            retention_stream:
              - selector: '{container_name="molecule"}'
                priority: 1
                period: 72h
          # the branch loki-defaults cannot reach: prepends the boltdb-shipper
          # v11 period to schema_config
          migrate_from_v11: true
          migration_dates:
            v11: "2021-03-01"
            v13: "2024-01-15"
          # Both are off the role default, and neither is a prefix of where the
          # role would otherwise write.
          directories:
            ansible: /data/ansible/logs/loki
            data: /data/loki-storage
        expected_compose_dir: /data/ansible/logs/loki
        expected_data_dir: /data/loki-storage
        # not a var of its own - it has to follow the relocated `ansible`, which
        # is only visible because `ansible` is off its default
        expected_config_dir: /data/ansible/logs/loki/config
        expected_log_format: logfmt
        expected_retention_period: 14d
        expected_retention_stream:
          - selector: '{container_name="molecule"}'
            priority: 1
            period: 72h
        expected_allow_structured_metadata: false
        expected_schemas:
          - v11
          - v13
        expected_schema_from:
          - "2021-03-01"
          - "2024-01-15"
        expected_env:
          - "MOLECULE_MARKER=loki-custom"
        expect_network_mode_none: true
        expected_networks:
          - molecule-loki
        # side_effect.yml creates this network and re-runs the role attached to
        # it; a service on the `none` default network cannot start, so the
        # disabled state is only reachable with an external network to move to
        molecule_external_network: molecule-loki
        # paths the role must NOT have touched - the defaults it no longer uses
        unexpected_paths:
          - /data/ansible/loki
          - /data/loki
