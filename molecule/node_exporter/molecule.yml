---
# Two platforms on purpose. `node-exporter-defaults` leaves `node_exporter`
# entirely alone, so it runs the real role defaults and cannot drift from them.
# `node-exporter-custom` moves the compose dir off its default, pins a different
# image tag, and - via side_effect.yml - disables the default network, so every
# branch in the template is covered by the same converge. The shared converge.yml
# includes the role by scenario name, so a second scenario is not an option - a
# scenario is a role name here.
platforms:
  - name: node-exporter-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: node-exporter-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # node_exporter's meta pulls in bootstrap, so this scenario has to
        # satisfy it. `bootstrap` is a plain dict override - it replaces the
        # role defaults wholesale, so every key the role reads has to be listed.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
        # the port node_exporter listens on inside the container; the role
        # never changes it, it is the exporter's own default and the value the
        # prometheus.io.port label has to agree with
        molecule_metrics_port: 9100
        # every host mount the container gets, as host:container pairs. Spelled
        # out rather than read back off the template: these are what gives the
        # exporter the host's view instead of its own namespaced one.
        expected_binds:
          - "/proc:/host/proc"
          - "/sys:/host/sys"
          - "/:/rootfs"
          - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `node_exporter`. Deriving the expectation from the same
    # var the template reads would let a broken template agree with a broken
    # test.
    host_vars:
      node-exporter-defaults:
        # `node_exporter` is deliberately NOT set: this host runs the role
        # defaults as published, so it cannot pin a stale copy of them. tests.yml
        # re-reads defaults/main.yaml to prove the expectations below match it.
        expected_compose_dir: /data/ansible/node-exporter
        expected_image: prom/node-exporter
        expected_version: v1.8.1
        expect_network_mode_none: false
        # compose names the project after the basename of project_src, so this
        # is the network it creates for the role when the flag is off
        expected_networks:
          - node-exporter_default
      node-exporter-custom:
        node_exporter:
          image: prom/node-exporter
          # off the default, so the tag reaching the running container is
          # visible - the exporter reports its own version in build_info
          version: v1.8.2
          # converge runs with the default network on; side_effect.yml flips
          # both of these and re-runs the role, so verify sees the disabled
          # state on this host and the default state on node-exporter-defaults
          networks: []
          disable_default_network: false
          directories:
            # off the role default, and not a prefix of it. The basename differs
            # too, so the compose project name moves with it - which is what
            # names the default network below.
            ansible: /data/ansible/metrics/nodeexp
        expected_compose_dir: /data/ansible/metrics/nodeexp
        expected_image: prom/node-exporter
        expected_version: v1.8.2
        expect_network_mode_none: true
        expected_networks:
          - molecule-node-exporter
        # side_effect.yml creates this network and re-runs the role attached to
        # it; a service on the `none` default network cannot start, so the
        # disabled state is only reachable with an external network to move to
        molecule_external_network: molecule-node-exporter
        # the default path the role must no longer touch on this host
        unexpected_paths:
          - /data/ansible/node-exporter
