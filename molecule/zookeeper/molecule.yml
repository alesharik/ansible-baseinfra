---
# Two platforms forming ONE ensemble, not two independent servers. That is the
# point of this scenario: ZOO_SERVERS is built by extracting every quorum
# member's id, peer_ip and client_port out of hostvars, and each member's own
# entry is rewritten to 0.0.0.0 because a container cannot bind the host address
# its peer ports are published on. Neither mechanism is exercised by a single
# server - a znode written on node-1 that reads back on node-2 is, because a
# 2-member ensemble cannot commit a write without both members.
#
# The two hosts also split the option matrix:
#   zk-node-1  default directories, metrics on. Pins a copy of the published
#              role defaults; tests.yml re-reads defaults/main.yaml from the
#              controller so the copy cannot drift unnoticed.
#   zk-node-2  relocated directories, renamed network, operator `config`
#              entries, metrics OFF - which is where the compose template's
#              label branch is covered in its absent form.
#
# Two members is deliberately the wrong shape for production - a quorum is a
# strict majority, so this ensemble tolerates no failures at all. It is exactly
# what makes it a good test: nothing here can pass without both members.
#
# The shared converge.yml includes the role by scenario name, so a second
# scenario is not an option - a scenario is a role name here.
platforms:
  - name: zk-node-1
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: zk-node-2
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # zookeeper's meta pulls in bootstrap, so this scenario has to satisfy
        # it. `bootstrap` is a plain dict override - it replaces the role
        # defaults wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          # the prometheus.io.instance label is built from ansible_hostname, so
          # the instances must actually carry their names
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible

        # Written on node-1, read back on node-2. A 2-member ensemble cannot
        # commit a write without both members, so this single pair is the
        # assertion that the ensemble formed at all.
        molecule_znode: /molecule-zookeeper
        molecule_znode_value: written-by-zk-node-1
        # What both members must report once they agree on each other. This is
        # a series from ZooKeeper's own Prometheus provider, which does NOT
        # prefix its names with zk_ - that prefix belongs to the mntr four
        # letter word output, a different interface entirely.
        molecule_expected_quorum_size: "2.0"

    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `zookeeper`. Deriving the expectation from the same var
    # the templates read would let a broken template agree with a broken test.
    host_vars:
      zk-node-1:
        # A copy of the published defaults, except for the three keys that have
        # to differ for two hosts to form an ensemble at all - peer_ip, quorum
        # and listen_ips, which ship empty. tests.yml reads
        # roles/zookeeper/defaults/main.yaml from the controller and asserts
        # every other key still matches, so this copy cannot go stale unnoticed.
        zookeeper:
          image: zookeeper
          version: "3.9.5"
          id: 1
          # The instance's own address on the molecule network. Both members
          # publish their peer and election ports on it and dial each other
          # there.
          peer_ip: "{{ ansible_default_ipv4.address }}"
          quorum:
            - zk-node-1
            - zk-node-2
          # 127.0.0.1 deliberately left out: the client port is published per
          # address, and a loopback publication would resolve to a different
          # server on each host.
          listen_ips:
            - "{{ ansible_default_ipv4.address }}"
          network: zookeeper
          client_port: 2181
          tick_time: 2000
          init_limit: 5
          sync_limit: 2
          max_client_cnxns: 60
          autopurge:
            purge_interval: 1
            snap_retain_count: 3
          four_lw_commands: "srvr,ruok,mntr"
          admin_server: true
          jvm_flags: "-XX:+UseShenandoahGC -Xmx512m"
          # the empty branch of ZOO_CFG_EXTRA's operator half; node-2 covers the
          # other one
          config: []
          metrics:
            enabled: true
            port: 7070
          directories:
            ansible: "{{ dir.ansible }}/zookeeper"
            data: "{{ dir.data }}/zookeeper/data"
            datalog: "{{ dir.data }}/zookeeper/datalog"
            logs: "{{ dir.data }}/zookeeper/logs"

        expected_compose_dir: /data/ansible/zookeeper
        expected_data_dir: /data/zookeeper/data
        expected_datalog_dir: /data/zookeeper/datalog
        expected_logs_dir: /data/zookeeper/logs
        expected_network: zookeeper
        # compose names the project after project_src, which is
        # dir.ansible/zookeeper on this host
        expected_container: zookeeper-zookeeper-1
        expected_id: "1"
        expected_client_port: 2181
        expected_mounts:
          - /data/zookeeper/data:/data
          - /data/zookeeper/datalog:/datalog
          - /data/zookeeper/logs:/logs
        # the image this host's client containers are run from - the role
        # already pulled it, so using it costs no extra pull
        expected_image: zookeeper:3.9.5
        expected_metrics_enabled: true
        expected_metrics_port: 7070
        expected_instance_label: zk-node-1-zookeeper
        # spelled out: metrics on and no operator config means exactly the two
        # provider directives, in this order
        expected_cfg_extra: >-
          metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
          metricsProvider.httpPort=7070
        expected_zoo_cfg_lines:
          - "metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider"
          - "metricsProvider.httpPort=7070"

      zk-node-2:
        zookeeper:
          image: zookeeper
          version: "3.9.5"
          id: 2
          peer_ip: "{{ ansible_default_ipv4.address }}"
          quorum:
            - zk-node-1
            - zk-node-2
          listen_ips:
            - "{{ ansible_default_ipv4.address }}"
          # renamed, so the network the role creates is not just the role name
          network: zookeeper-ensemble
          client_port: 2181
          tick_time: 2000
          init_limit: 5
          sync_limit: 2
          max_client_cnxns: 60
          autopurge:
            purge_interval: 1
            snap_retain_count: 3
          four_lw_commands: "srvr,ruok,mntr"
          admin_server: true
          jvm_flags: "-XX:+UseShenandoahGC -Xmx512m"
          # Pushed all the way through: tests.yml reads the generated zoo.cfg
          # out of the running container, so this proves `config` reaches
          # ZooKeeper's configuration and not just an environment variable.
          config:
            - "maxSessionTimeout=60000"
            - "preAllocSize=131072"
          # off here: this is where the compose template's label branch is
          # covered in its absent form
          metrics:
            enabled: false
            port: 7070
          directories:
            ansible: "{{ dir.ansible }}/zookeeper-moved"
            data: "{{ dir.data }}/zookeeper-moved/data"
            datalog: "{{ dir.data }}/zookeeper-moved/datalog"
            logs: "{{ dir.data }}/zookeeper-moved/logs"

        expected_compose_dir: /data/ansible/zookeeper-moved
        expected_data_dir: /data/zookeeper-moved/data
        expected_datalog_dir: /data/zookeeper-moved/datalog
        expected_logs_dir: /data/zookeeper-moved/logs
        expected_network: zookeeper-ensemble
        # directories.ansible is relocated here, and compose names the project
        # after it - so this name also proves the move actually took effect
        expected_container: zookeeper-moved-zookeeper-1
        expected_id: "2"
        expected_client_port: 2181
        expected_mounts:
          - /data/zookeeper-moved/data:/data
          - /data/zookeeper-moved/datalog:/datalog
          - /data/zookeeper-moved/logs:/logs
        expected_image: zookeeper:3.9.5
        expected_metrics_enabled: false
        expected_metrics_port: 7070
        # metrics are off, so ZOO_CFG_EXTRA carries the operator entries alone
        expected_cfg_extra: "maxSessionTimeout=60000 preAllocSize=131072"
        expected_zoo_cfg_lines:
          - "maxSessionTimeout=60000"
          - "preAllocSize=131072"
        # the default paths this host must no longer touch
        unexpected_paths:
          - /data/ansible/zookeeper
          - /data/zookeeper
