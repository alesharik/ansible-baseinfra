---
# --- defaults have not drifted from what this scenario pins ------------------
# node-exporter-defaults deliberately does not set `node_exporter` at all, so it
# runs the role defaults as published. The verify play does not include the role,
# so those defaults are not in scope here - the expectations are spelled out in
# host_vars, and this re-reads the file to prove they still match it.
- name: Read the role defaults from the controller
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/roles/node_exporter/defaults/main.yaml"
  delegate_to: localhost
  become: false
  register: role_defaults_raw
  when: inventory_hostname == 'node-exporter-defaults'

- name: Check the pinned expectations still equal the role defaults
  vars:
    role_defaults: "{{ role_defaults_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - role_defaults.node_exporter.image == expected_image
      - role_defaults.node_exporter.version == expected_version
      - role_defaults.node_exporter.networks == []
      - not role_defaults.node_exporter.disable_default_network
      # the only root the role exposes - a `data` key appearing here would mean
      # the role grew state this scenario never checks
      - role_defaults.node_exporter.directories | list == ['ansible']
    fail_msg: >-
      roles/node_exporter/defaults/main.yaml has changed - the "defaults" host is
      running something else now
  when: inventory_hostname == 'node-exporter-defaults'

# --- the compose project landed where directories.ansible points -------------
- name: Stat the compose dir
  ansible.builtin.stat:
    path: "{{ expected_compose_dir }}"
  register: node_exporter_compose_dir

- name: Check the compose dir exists
  ansible.builtin.assert:
    that:
      - node_exporter_compose_dir.stat.exists
      - node_exporter_compose_dir.stat.isdir
    fail_msg: "{{ expected_compose_dir }} is not a directory"

# the whole point of the var: a path still derived from dir.ansible would show
# up here even though every assertion above passed
- name: Stat the default path the role must no longer use
  ansible.builtin.stat:
    path: "{{ item }}"
  register: node_exporter_default_paths
  loop: "{{ unexpected_paths | default([]) }}"

- name: Check the role wrote nothing outside node_exporter.directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      {{ item.item }} exists - something in the role still derives its path from
      dir.ansible instead of node_exporter.directories
  loop: "{{ node_exporter_default_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

# --- docker-compose.yml ------------------------------------------------------
- name: Read the rendered docker-compose.yml
  ansible.builtin.slurp:
    src: "{{ expected_compose_dir }}/docker-compose.yml"
  register: node_exporter_compose_raw

- name: Check the image and tag from the vars reached the compose file
  vars:
    compose: "{{ node_exporter_compose_raw.content | b64decode | from_yaml }}"
    service: "{{ compose.services.prom }}"
  ansible.builtin.assert:
    that:
      - compose.services | list == ['prom']
      # fixed on purpose: vmagent's docker_sd relabels on the container name, and
      # the role documents `node-exporter` as the name it deploys
      - service.container_name == 'node-exporter'
      - service.image == expected_image ~ ':' ~ expected_version
      - service.restart == 'always'
    fail_msg: "compose runs image {{ service.image }} as {{ service.container_name | default('<unset>') }}"

- name: Check the host is mounted into the container read-only
  vars:
    compose: "{{ node_exporter_compose_raw.content | b64decode | from_yaml }}"
    volumes: "{{ compose.services.prom.volumes }}"
  ansible.builtin.assert:
    that:
      # /proc, /sys and / are the exporter's whole data source, and it must not
      # be able to write to any of them
      - "'/proc:/host/proc:ro' in volumes"
      - "'/sys:/host/sys:ro' in volumes"
      - "'/:/rootfs:ro' in volumes"
      # not :ro - the systemd collector talks to dbus over this socket
      - "'/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket' in volumes"
    fail_msg: "compose mounts {{ volumes }}"

- name: Check the collector flags point at the mounted host paths
  vars:
    compose: "{{ node_exporter_compose_raw.content | b64decode | from_yaml }}"
    service: "{{ compose.services.prom }}"
  ansible.builtin.assert:
    that:
      # each of these is the container-side half of a mount above; a flag that
      # drifted from its mount would leave the exporter reading its own namespace
      - "'--path.procfs=/host/proc' in service.command"
      - "'--path.sysfs=/host/sys' in service.command"
      - "'--path.rootfs=/rootfs' in service.command"
      - "'--collector.systemd' in service.command"
      - "'--collector.processes' in service.command"
      # without this the container reads its own /proc and /sys rather than the
      # host's, and every metric describes the container instead of the machine
      - "'apparmor:unconfined' in service.security_opt"
    fail_msg: "compose runs {{ service.command }} with security_opt {{ service.security_opt | default('<unset>') }}"

- name: Check the prometheus autodiscovery labels are present
  vars:
    compose: "{{ node_exporter_compose_raw.content | b64decode | from_yaml }}"
    labels: "{{ compose.services.prom.labels }}"
  ansible.builtin.assert:
    that:
      # vmagent keeps only containers carrying prometheus.io.path, then rewrites
      # __address__ from prometheus.io.port - see the collection README
      - labels['prometheus.io.path'] == '/metrics'
      - labels['prometheus.io.port'] | string == molecule_metrics_port | string
      - labels['prometheus.io.instance'] == inventory_hostname
    fail_msg: "compose labels are {{ labels }}"

# --- disable_default_network -------------------------------------------------
# node-exporter-defaults names no networks and leaves the flag off, so the
# template must emit no top-level networks mapping at all. node-exporter-custom
# was re-run by side_effect.yml with the flag on and one external network.
- name: Check no networks are declared when the flag is off
  vars:
    compose: "{{ node_exporter_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - compose.networks is not defined
      - compose.services.prom.networks is not defined
    fail_msg: >-
      compose declares networks {{ compose.networks | default({}) }} on a host
      that names none and leaves disable_default_network off
  when: not expect_network_mode_none

# spelled out rather than derived from node_exporter.networks: an expectation
# built from the same var the template reads would agree with a broken template
- name: Check the flag points the default network at none
  vars:
    compose: "{{ node_exporter_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - "compose.networks['default'] == {'external': true, 'name': 'none'}"
      - >-
        compose.networks['molecule-node-exporter'] ==
        {'external': true, 'name': 'molecule-node-exporter'}
      # the external network has to survive alongside default, not replace it -
      # a service left on the default network could not start at all
      - "compose.services.prom.networks == ['molecule-node-exporter']"
    fail_msg: "compose networks are {{ compose.networks | default('<unset>') }}"
  when: expect_network_mode_none

# --- the container actually runs the config it was handed --------------------
- name: Wait for the node-exporter container to report running
  ansible.builtin.command: docker inspect node-exporter
  register: node_exporter_inspect_raw
  changed_when: false
  retries: 30
  delay: 5
  # `and` short-circuits, so from_json never sees an empty stdout
  until: >-
    node_exporter_inspect_raw.rc == 0 and
    (node_exporter_inspect_raw.stdout | from_json)[0].State.Running

# the rendered file only proves the template; this proves docker acted on it
- name: Check docker bound every host path the exporter reads
  vars:
    binds: "{{ (node_exporter_inspect_raw.stdout | from_json)[0].HostConfig.Binds }}"
    # docker appends the access mode, so a bind reads host:container:ro here
    bind_paths: "{{ binds | map('regex_replace', '^([^:]+:[^:]+).*$', '\\1') | list }}"
  ansible.builtin.assert:
    that:
      - expected_binds | difference(bind_paths) | length == 0
    fail_msg: "docker bound {{ binds }}, expected it to carry {{ expected_binds }}"

- name: Check docker kept the host filesystem mounts read-only
  vars:
    mounts: "{{ (node_exporter_inspect_raw.stdout | from_json)[0].Mounts }}"
    rootfs: "{{ mounts | selectattr('Destination', 'eq', '/rootfs') | first }}"
    procfs: "{{ mounts | selectattr('Destination', 'eq', '/host/proc') | first }}"
    sysfs: "{{ mounts | selectattr('Destination', 'eq', '/host/sys') | first }}"
  ansible.builtin.assert:
    that:
      - not rootfs.RW
      - not procfs.RW
      - not sysfs.RW
    fail_msg: >-
      the container can write to the host filesystem -
      /rootfs RW={{ rootfs.RW }}, /host/proc RW={{ procfs.RW }}, /host/sys RW={{ sysfs.RW }}

- name: Check docker applied the unconfined apparmor profile
  vars:
    security_opt: "{{ (node_exporter_inspect_raw.stdout | from_json)[0].HostConfig.SecurityOpt | default([]) }}"
  ansible.builtin.assert:
    that:
      - "'apparmor:unconfined' in security_opt"
    fail_msg: "container security options are {{ security_opt }}"

- name: Check the container joined the expected networks
  vars:
    nets: "{{ (node_exporter_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks | list }}"
  ansible.builtin.assert:
    that:
      - nets == expected_networks
    fail_msg: "container is attached to {{ nets }}, expected {{ expected_networks }}"

- name: Check the autodiscovery labels reached the running container
  vars:
    labels: "{{ (node_exporter_inspect_raw.stdout | from_json)[0].Config.Labels }}"
  ansible.builtin.assert:
    that:
      - labels['prometheus.io.path'] == '/metrics'
      - labels['prometheus.io.port'] == molecule_metrics_port | string
      - labels['prometheus.io.instance'] == inventory_hostname
    fail_msg: "container labels are {{ labels }}"

# --- the exporter answers, and reports the machine rather than itself ---------
# node_exporter publishes no ports, so this goes to the container's own address
# on whichever network it ended up attached to. That is also the only way vmagent
# reaches it, which is why disable_default_network needs a network named.
- name: Read the container address
  vars:
    networks: "{{ (node_exporter_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks }}"
  ansible.builtin.set_fact:
    node_exporter_ip: "{{ networks[expected_networks[0]].IPAddress }}"

- name: Wait for the metrics endpoint to answer
  ansible.builtin.uri:
    url: "http://{{ node_exporter_ip }}:{{ molecule_metrics_port }}/metrics"
    return_content: true
    status_code: 200
  register: node_exporter_metrics
  retries: 30
  delay: 5
  until: node_exporter_metrics.status is defined and node_exporter_metrics.status == 200

# the tag in the compose file only proves the template ran; build_info is the
# running binary reporting its own version back
- name: Check the running exporter is the version the vars asked for
  vars:
    # the image tag carries a leading v, the metric label does not
    build_version: "{{ expected_version | regex_replace('^v', '') }}"
  ansible.builtin.assert:
    that:
      - "'node_exporter_build_info' in node_exporter_metrics.content"
      - "'version=\"' ~ build_version ~ '\"' in node_exporter_metrics.content"
    fail_msg: >-
      the metrics endpoint did not report node_exporter_build_info with
      version="{{ build_version }}"

# the mounts and the apparmor profile exist so the exporter describes the
# machine; these two metrics only appear when it can actually read them
- name: Check the exporter reports the host rather than its own namespace
  ansible.builtin.assert:
    that:
      # from /host/proc - the container's own uptime would be seconds
      - "'node_boot_time_seconds' in node_exporter_metrics.content"
      # from /rootfs, and only emitted when the filesystem collector found mounts
      - "'node_filesystem_size_bytes' in node_exporter_metrics.content"
      # from /host/sys
      - "'node_cpu_seconds_total' in node_exporter_metrics.content"
    fail_msg: >-
      the exporter answered without the host collectors in it - it is probably
      reading its own /proc and /sys instead of the mounted ones

# the flag excludes the container's own mountpoints, so the metrics must not
# describe the paths the host was mounted at
- name: Check the filesystem collector excludes the container's own mounts
  ansible.builtin.assert:
    that:
      - "'mountpoint=\"/host/proc\"' not in node_exporter_metrics.content"
      - "'mountpoint=\"/host/sys\"' not in node_exporter_metrics.content"
    fail_msg: >-
      the filesystem collector reported the container's own mountpoints -
      --collector.filesystem.mount-points-exclude did not reach the exporter
