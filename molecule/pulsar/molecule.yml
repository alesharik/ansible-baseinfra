---
# Three platforms, because the role has two shapes and only one of them can be
# seen on a single host:
#
#   pulsar-node-1  cluster member. Default directories, metrics on, functions
#                  off. Produces the messages the other member has to serve.
#   pulsar-node-2  cluster member. Relocated directories, its own three docker
#                  networks, metrics OFF, operator `config` entries - the absent
#                  form of every branch node-1 covers. Consumes what node-1
#                  produced.
#   pulsar-single  the single-host shape, on the published defaults: no
#                  advertised_ip, so the broker is known by its compose service
#                  name, and the functions worker on against bookkeeper's table
#                  service. tests.yml re-reads defaults/main.yaml from the
#                  controller so this host's copy cannot drift unnoticed.
#
# The two cluster members share a 2-member zookeeper ensemble and a 2-bookie
# BookKeeper cluster through it, and run one Pulsar cluster on top. That is what
# makes them worth two instances: a topic is owned by exactly one broker at a
# time, so consuming through node-2 what was produced through node-1 only works
# if the two found each other in the metadata and the lookup handed back an
# address the client could actually reach. Their managed ledgers are 2/2/2, so
# every entry is held by both bookies and both have to answer. Nothing about
# either is observable on one host.
#
# pulsar-single keeps the functions worker, which the cluster members turn off: it
# needs bookkeeper's table service, and a range server registers itself under a
# name that only resolves inside docker on its own host. Testing it where it
# works is the honest place for it.
#
# The zookeeper and the bookkeeper each host needs are deployed by
# prepare_tasks.yml, not by this role - pulsar's dependencies are bootstrap and
# docker, and external ones are the normal case.
platforms:
  - name: pulsar-node-1
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: pulsar-node-2
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false
  - name: pulsar-single
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # pulsar's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          # the prometheus.io.instance label is built from ansible_hostname, so
          # the instances must actually carry their names
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible

        # The round trip every host makes: produced through one broker's service
        # url and consumed through another's.
        molecule_topic: "persistent://public/default/molecule"
        molecule_subscription: molecule-sub
        molecule_messages: 20
        molecule_message: written-by-molecule

    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `pulsar`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      pulsar-node-1:
        zookeeper:
          image: zookeeper
          version: "3.9.5"
          id: 1
          peer_ip: "{{ ansible_default_ipv4.address }}"
          quorum:
            - pulsar-node-1
            - pulsar-node-2
          # Both the bookie and the broker reach zookeeper over the docker
          # network below, so the client port needs no publication. The peer and
          # election ports are published on peer_ip by the role itself.
          listen_ips: []
          network: zookeeper
          client_port: 2181
          tick_time: 2000
          init_limit: 5
          sync_limit: 2
          max_client_cnxns: 60
          autopurge:
            purge_interval: 1
            snap_retain_count: 3
          four_lw_commands: "srvr,ruok,mntr"
          admin_server: true
          jvm_flags: "-XX:+UseShenandoahGC -Xmx512m"
          config: []
          metrics:
            enabled: false
            port: 7070
          directories:
            ansible: "{{ dir.ansible }}/zookeeper"
            data: "{{ dir.data }}/zookeeper/data"
            datalog: "{{ dir.data }}/zookeeper/datalog"
            logs: "{{ dir.data }}/zookeeper/logs"

        bookkeeper:
          image: apache/bookkeeper
          version: "4.18.0"
          # The instance's own address on the molecule network, so the other
          # host's broker can dial this bookie.
          advertised_ip: "{{ ansible_default_ipv4.address }}"
          network: bookkeeper
          bookie_port: 3181
          zookeeper:
            network: zookeeper
            servers: "zookeeper:2181"
            ledgers_path: /ledgers
          http:
            enabled: true
            port: 8080
          metrics:
            enabled: false
          auto_recovery: true
          disk_usage:
            # A dind instance shares the host's disk, and a host over 95% full
            # would put every bookie here into read-only before the first write.
            threshold: 0.99
            warn_threshold: 0.99
          jvm:
            mem_opts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
            gc_opts: "-XX:+UseShenandoahGC"
          # Off on both cluster members: the table service is reachable on its
          # own host's docker network and nowhere else. pulsar-single covers it
          # where it works, which is also where the functions worker is.
          stream_storage:
            enabled: false
            grpc_port: 4181
            num_storage_containers: 8
            ensemble_size: 1
            write_quorum: 1
            ack_quorum: 1
          config: {}
          directories:
            ansible: "{{ dir.ansible }}/bookkeeper"
            journal: "{{ dir.data }}/bookkeeper/journal"
            ledgers: "{{ dir.data }}/bookkeeper/ledgers"
            ranges: "{{ dir.data }}/bookkeeper/ranges"

        pulsar:
          image: apachepulsar/pulsar
          version: "4.2.1"
          cluster_name: cluster-a
          # What this broker registers itself as, so it is also the address
          # node-2's client is handed when the lookup redirects it here.
          advertised_ip: "{{ ansible_default_ipv4.address }}"
          # Joined, not created. zookeeper's is where the metadata is reached by
          # service name; bookkeeper's is where the bookies this host's broker
          # dials resolve. First entry is the one the metrics label names.
          networks:
            - zookeeper
            - bookkeeper
          broker_port: 6650
          web_port: 8080
          zookeeper:
            servers: "zookeeper:2181"
          bookkeeper:
            ledgers_path: /ledgers
            # matches this host's bookkeeper role var, so the two cannot
            # initialise the table service metadata with different counts
            num_storage_containers: 8
          # 2/2/2 across the two bookies: every entry is held by both and both
          # have to answer, so a topic here cannot be written unless the
          # BookKeeper cluster really formed.
          managed_ledger:
            ensemble_size: 2
            write_quorum: 2
            ack_quorum: 2
          functions_worker:
            enabled: false
            state_storage_url: "bk://bookkeeper:4181"
            num_package_replicas: 1
          metrics:
            enabled: true
          jvm:
            mem_opts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
            gc_opts: "-XX:+UseShenandoahGC"
          config: {}
          directories:
            ansible: "{{ dir.ansible }}/pulsar"
            functions: "{{ dir.data }}/pulsar/functions"

        expected_compose_dir: /data/ansible/pulsar
        expected_functions_dir: /data/pulsar/functions
        # in order: the role joins these and creates none
        expected_networks:
          - zookeeper
          - bookkeeper
        # the first of them, which is what the metrics label has to name
        expected_zk_servers: "zookeeper:2181"
        expected_metrics_network: zookeeper
        # what docker reports the container is actually attached to
        expected_container_networks:
          - zookeeper
          - bookkeeper
        # compose names the project after project_src, which is
        # dir.ansible/pulsar on this host
        expected_container: pulsar-broker-1
        expected_image: apachepulsar/pulsar:4.2.1
        expected_cluster_name: cluster-a
        expected_broker_port: 6650
        expected_web_port: 8080
        expected_metrics_enabled: true
        expected_instance_label: pulsar-node-1-pulsar
        expected_functions_worker: false
        expected_ml_ensemble: 2
        expected_ml_write: 2
        expected_ml_ack: 2
        expected_config_lines: []
        # Built from the instances' gathered facts, which is an independent
        # source from the pulsar.advertised_ip the template consumed.
        expected_advertised: "{{ ansible_default_ipv4.address }}"
        expected_ports:
          - "{{ ansible_default_ipv4.address }}:6650:6650"
          - "{{ ansible_default_ipv4.address }}:8080:8080"
        # Both members, as they registered themselves in zookeeper.
        expected_roster:
          - "{{ hostvars['pulsar-node-1'].ansible_default_ipv4.address }}:8080"
          - "{{ hostvars['pulsar-node-2'].ansible_default_ipv4.address }}:8080"
        # Off the docker network, through the published port - the way anything
        # on another host reaches this broker.
        expected_client_network: host
        expected_admin_url: "http://{{ ansible_default_ipv4.address }}:8080"
        expected_produces: true
        expected_produce_url: "pulsar://{{ ansible_default_ipv4.address }}:6650"
        expected_consumes: false

      pulsar-node-2:
        zookeeper:
          image: zookeeper
          version: "3.9.5"
          id: 2
          peer_ip: "{{ ansible_default_ipv4.address }}"
          quorum:
            - pulsar-node-1
            - pulsar-node-2
          # Published here, unlike on node-1: this host's broker joins no docker
          # network and reaches zookeeper at this address.
          listen_ips:
            - "{{ ansible_default_ipv4.address }}"
          # renamed, so nothing on this host depends on the role's default name
          network: zookeeper-ensemble
          client_port: 2181
          tick_time: 2000
          init_limit: 5
          sync_limit: 2
          max_client_cnxns: 60
          autopurge:
            purge_interval: 1
            snap_retain_count: 3
          four_lw_commands: "srvr,ruok,mntr"
          admin_server: true
          jvm_flags: "-XX:+UseShenandoahGC -Xmx512m"
          config: []
          metrics:
            enabled: false
            port: 7070
          directories:
            ansible: "{{ dir.ansible }}/zookeeper"
            data: "{{ dir.data }}/zookeeper/data"
            datalog: "{{ dir.data }}/zookeeper/datalog"
            logs: "{{ dir.data }}/zookeeper/logs"

        bookkeeper:
          image: apache/bookkeeper
          version: "4.18.0"
          advertised_ip: "{{ ansible_default_ipv4.address }}"
          # renamed too, so pulsar.bookkeeper.network is not the default either
          network: bookkeeper-second
          bookie_port: 3181
          zookeeper:
            network: zookeeper-ensemble
            servers: "zookeeper:2181"
            ledgers_path: /ledgers
          http:
            enabled: true
            port: 8080
          metrics:
            enabled: false
          auto_recovery: true
          disk_usage:
            threshold: 0.99
            warn_threshold: 0.99
          jvm:
            mem_opts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
            gc_opts: "-XX:+UseShenandoahGC"
          stream_storage:
            enabled: false
            grpc_port: 4181
            num_storage_containers: 8
            ensemble_size: 1
            write_quorum: 1
            ack_quorum: 1
          config: {}
          directories:
            ansible: "{{ dir.ansible }}/bookkeeper"
            journal: "{{ dir.data }}/bookkeeper/journal"
            ledgers: "{{ dir.data }}/bookkeeper/ledgers"
            ranges: "{{ dir.data }}/bookkeeper/ranges"

        pulsar:
          image: apachepulsar/pulsar
          version: "4.2.1"
          cluster_name: cluster-a
          advertised_ip: "{{ ansible_default_ipv4.address }}"
          # The address-only shape, and the reason this host exists: no docker
          # network at all. The broker sits on the compose project's own default
          # network and reaches zookeeper at a published address instead of a
          # service name - and the bookies likewise, at the advertised_ip each
          # registered itself under. Nothing here resolves a docker DNS name, so
          # this fails if the role still needs one.
          networks: []
          broker_port: 6650
          web_port: 8080
          zookeeper:
            servers: "{{ ansible_default_ipv4.address }}:2181"
          bookkeeper:
            ledgers_path: /ledgers
            num_storage_containers: 8
          managed_ledger:
            ensemble_size: 2
            write_quorum: 2
            ack_quorum: 2
          # Off here, which is where the compose template's volumes branch and
          # the functions download directory are covered in their absent form.
          functions_worker:
            enabled: false
            state_storage_url: "bk://bookkeeper:4181"
            num_package_replicas: 1
          # Off here too, covering the labels branch in its absent form.
          metrics:
            enabled: false
          jvm:
            mem_opts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
            gc_opts: "-XX:+UseShenandoahGC"
          # Pushed all the way through: tests.yml reads the generated broker.conf
          # out of the running container, so this proves `config` reaches
          # Pulsar's configuration and not just an environment variable the image
          # ignored. One key of each kind, because the two take different paths
          # through apply-config-from-env.py: brokerDeduplicationEnabled has a
          # line in the shipped conf and is rewritten, moleculeProbe has none and
          # is appended - which only happens because the role renders these with
          # the PULSAR_PREFIX_ form. A bare variable would drop the second one
          # without a word. Pulsar reads the fields it knows and ignores the
          # rest, so an invented key is inert.
          config:
            brokerDeduplicationEnabled: "true"
            moleculeProbe: written-by-molecule
          directories:
            ansible: "{{ dir.ansible }}/pulsar-moved"
            functions: "{{ dir.data }}/pulsar-moved/functions"

        expected_compose_dir: /data/ansible/pulsar-moved
        expected_functions_dir: /data/pulsar-moved/functions
        # none: this host joins nothing, so the compose file must carry no
        # networks key at all rather than an empty one
        expected_networks: []
        # the docker network the *zookeeper* role made here - the tests' own
        # helper containers still need somewhere to run
        # an address, not a name - the whole point of this host
        expected_zk_servers: "{{ ansible_default_ipv4.address }}:2181"
        # With nothing joined, compose puts the broker on the project's own
        # default network - named after directories.ansible, so this name is also
        # what proves the relocation took.
        expected_container_networks:
          - pulsar-moved_default
        # directories.ansible is relocated here, and compose names the project
        # after it - so this name also proves the move actually took effect
        expected_container: pulsar-moved-broker-1
        expected_image: apachepulsar/pulsar:4.2.1
        expected_cluster_name: cluster-a
        expected_broker_port: 6650
        expected_web_port: 8080
        expected_metrics_enabled: false
        expected_instance_label: pulsar-node-2-pulsar-moved
        expected_functions_worker: false
        expected_ml_ensemble: 2
        expected_ml_write: 2
        expected_ml_ack: 2
        # read back out of the container's generated conf
        expected_config_lines:
          - "brokerDeduplicationEnabled=true"
          - "moleculeProbe=written-by-molecule"
        expected_advertised: "{{ ansible_default_ipv4.address }}"
        expected_ports:
          - "{{ ansible_default_ipv4.address }}:6650:6650"
          - "{{ ansible_default_ipv4.address }}:8080:8080"
        expected_roster:
          - "{{ hostvars['pulsar-node-1'].ansible_default_ipv4.address }}:8080"
          - "{{ hostvars['pulsar-node-2'].ansible_default_ipv4.address }}:8080"
        expected_client_network: host
        expected_admin_url: "http://{{ ansible_default_ipv4.address }}:8080"
        expected_produces: false
        expected_consumes: true
        expected_consume_url: "pulsar://{{ ansible_default_ipv4.address }}:6650"
        # the default paths this host must no longer touch
        unexpected_paths:
          - /data/ansible/pulsar
          - /data/pulsar

      pulsar-single:
        # Standalone: one server, no quorum, no peer_ip - the single-host shape
        # the broker below is the counterpart of.
        zookeeper:
          image: zookeeper
          version: "3.9.5"
          id: 1
          peer_ip: ""
          quorum: []
          listen_ips: []
          network: zookeeper
          client_port: 2181
          tick_time: 2000
          init_limit: 5
          sync_limit: 2
          max_client_cnxns: 60
          autopurge:
            purge_interval: 1
            snap_retain_count: 3
          four_lw_commands: "srvr,ruok,mntr"
          admin_server: true
          jvm_flags: "-XX:+UseShenandoahGC -Xmx512m"
          config: []
          metrics:
            enabled: false
            port: 7070
          directories:
            ansible: "{{ dir.ansible }}/zookeeper"
            data: "{{ dir.data }}/zookeeper/data"
            datalog: "{{ dir.data }}/zookeeper/datalog"
            logs: "{{ dir.data }}/zookeeper/logs"

        # One bookie, on the bookkeeper role's own defaults except for the disk
        # thresholds - and with stream_storage left ON, because the functions
        # worker below keeps its state in that table service.
        bookkeeper:
          image: apache/bookkeeper
          version: "4.18.0"
          advertised_ip: ""
          network: bookkeeper
          bookie_port: 3181
          zookeeper:
            network: zookeeper
            servers: "zookeeper:2181"
            ledgers_path: /ledgers
          http:
            enabled: true
            port: 8080
          metrics:
            enabled: false
          auto_recovery: true
          disk_usage:
            threshold: 0.99
            warn_threshold: 0.99
          jvm:
            mem_opts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
            gc_opts: "-XX:+UseShenandoahGC"
          stream_storage:
            enabled: true
            grpc_port: 4181
            num_storage_containers: 8
            ensemble_size: 1
            write_quorum: 1
            ack_quorum: 1
          config: {}
          directories:
            ansible: "{{ dir.ansible }}/bookkeeper"
            journal: "{{ dir.data }}/bookkeeper/journal"
            ledgers: "{{ dir.data }}/bookkeeper/ledgers"
            ranges: "{{ dir.data }}/bookkeeper/ranges"

        # A copy of the published defaults, except that the functions worker is
        # turned on. tests.yml reads roles/pulsar/defaults/main.yaml from the
        # controller and asserts every other key still matches, so this copy
        # cannot go stale unnoticed.
        pulsar:
          image: apachepulsar/pulsar
          version: "4.2.1"
          cluster_name: cluster-a
          # left at the default: the broker is known by its compose service
          # name, which is the whole of the single-host shape
          advertised_ip: ""
          networks:
            - zookeeper
            - bookkeeper
          broker_port: 6650
          web_port: 8080
          zookeeper:
            servers: "zookeeper:2181"
          bookkeeper:
            ledgers_path: /ledgers
            num_storage_containers: 8
          managed_ledger:
            ensemble_size: 1
            write_quorum: 1
            ack_quorum: 1
          # On here, and only here: it needs bookkeeper's table service, which a
          # range server publishes under a name that resolves on this host's
          # docker network and nowhere else.
          functions_worker:
            enabled: true
            state_storage_url: "bk://bookkeeper:4181"
            num_package_replicas: 1
          metrics:
            enabled: true
          jvm:
            mem_opts: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
            gc_opts: "-XX:+UseShenandoahGC"
          config: {}
          directories:
            ansible: "{{ dir.ansible }}/pulsar"
            functions: "{{ dir.data }}/pulsar/functions"

        expected_compose_dir: /data/ansible/pulsar
        expected_functions_dir: /data/pulsar/functions
        expected_networks:
          - zookeeper
          - bookkeeper
        expected_zk_servers: "zookeeper:2181"
        expected_metrics_network: zookeeper
        expected_container_networks:
          - zookeeper
          - bookkeeper
        expected_container: pulsar-broker-1
        expected_image: apachepulsar/pulsar:4.2.1
        expected_cluster_name: cluster-a
        expected_broker_port: 6650
        expected_web_port: 8080
        expected_metrics_enabled: true
        expected_instance_label: pulsar-single-pulsar
        expected_functions_worker: true
        expected_ml_ensemble: 1
        expected_ml_write: 1
        expected_ml_ack: 1
        expected_config_lines: []
        # No advertised_ip, so the broker is known by the compose service name -
        # spelled out, because that fallback is the single-host shape itself.
        expected_advertised: broker
        # nothing published: without an advertised_ip there is no address to
        # publish on, and the broker is reachable on its docker network alone
        expected_ports: []
        expected_roster:
          - "broker:8080"
        # By service name, from a network the broker joined - the only way to
        # reach a broker that advertises one.
        expected_client_network: zookeeper
        expected_admin_url: "http://broker:8080"
        expected_produces: true
        expected_produce_url: "pulsar://broker:6650"
        expected_consumes: true
        expected_consume_url: "pulsar://broker:6650"
