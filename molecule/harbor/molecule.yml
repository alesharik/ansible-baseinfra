---
# Two platforms on purpose.
#
#   harbor-default  Default directories, trivy on, metrics on, nothing
#                   published, no extra networks, and one network carrying both
#                   the database and redis - which is the case the compose
#                   template has to attach once rather than twice. tests.yml
#                   re-reads roles/harbor/defaults/main.yaml from the controller
#                   and asserts this host's copy still matches it.
#   harbor-moved    Relocated directories, trivy off, metrics off, separate
#                   database and redis networks, a published port, an extra
#                   network on the proxy, and `config` pushed through to the
#                   generated component config - the absent form of every branch
#                   the first host covers.
#
# The shared converge.yml includes the role by scenario name, so a second
# scenario is not an option - a scenario is a role name here.
#
# This scenario is slow: harbor is nine images, about 2.4 GB per instance with
# trivy, and each instance pulls its own copy. Expect 25-35 minutes. Run it in
# the background.
#
# The postgres and the redis both come from prepare_tasks.yml, not from a meta
# dependency - harbor's dependencies are bootstrap and docker, and an external
# database and cache are the normal case.
#
# Both hosts set `syslog.enabled: false`, which is the one thing neither of them
# can cover. Harbor's bundled rsyslog container starts rsyslog with
# `sudo -u #10000`, and inside a molecule instance pam_unix fails the account
# check with "Authentication service cannot retrieve authentication info" - so
# the container restarts forever and every other container then fails to be
# created against a syslog endpoint that never opens. It is nesting, not the
# storage driver and not the capability set: the same image with the same caps
# works on an ordinary docker host, and CAP_DAC_READ_SEARCH, which the harbor
# container does not get, is what makes it work here. So the syslog path is
# covered by the compose template's absent branch only.
platforms:
  - name: harbor-default
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: harbor-moved
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # harbor's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          # the prometheus.io.instance label is built from inventory_hostname,
          # but harbor's own hostname has to resolve for the containers too
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible

        # The database prepare_tasks.yml brings up, and what harbor is told
        # about it. The postgres image creates this database and this user on
        # first start, which is all harbor needs - it writes its own schema.
        molecule_db_password: molecule-db-pass
        molecule_redis_password: molecule-redis-pass

    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `harbor`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      harbor-default:
        # One network for both, which is what the compose template has to
        # de-duplicate: two `networks:` keys of the same name is a compose error.
        molecule_db_network: harbor-backend
        redis:
          image: redis
          version: 8.10-alpine
          password: molecule-redis-pass
          network: harbor-backend
          config: ""
          # vm.overcommit_memory is not namespaced and would reach the kernel of
          # whatever machine runs this scenario
          overcommit_memory: false
          exporter:
            enabled: false
            image: oliver006/redis_exporter
            version: v1.89.0
          directories:
            ansible: "{{ dir.ansible }}/redis"
            data: "{{ dir.data }}/redis"

        # A copy of the published defaults, plus the five values that cannot
        # have one: the hostname, the password, and where the database and redis
        # are. tests.yml reads roles/harbor/defaults/main.yaml from the
        # controller and asserts every other key still matches, so this copy
        # cannot go stale unnoticed.
        harbor:
          version: "2.15.2"
          hostname: harbor-default.molecule
          external_url: ""
          admin_password: molecule-admin-pass
          network: harbor
          listen_ips: []
          networks: []
          # the one deliberate difference from the published defaults - see the
          # note at the top of this file
          syslog:
            enabled: false
            port: 1514
          db:
            host: postgres
            port: 5432
            name: harbor
            username: harbor
            password: molecule-db-pass
            network: harbor-backend
          redis:
            host: redis
            port: 6379
            password: molecule-redis-pass
            network: harbor-backend
          trivy:
            enabled: true
            skip_update: false
            security_check: "vuln,config,secret"
            github_token: ""
          metrics:
            enabled: true
          config: {}
          directories:
            ansible: "{{ dir.ansible }}/harbor"
            data: "{{ dir.data }}/harbor"
            logs: /var/log/harbor

        expected_compose_dir: /data/ansible/harbor
        expected_data_dir: /data/harbor
        # only read by the defaults-drift assertion: with syslog off nothing
        # writes here and the role does not create it
        expected_logs_dir: /var/log/harbor
        expected_network: harbor
        expected_backend_networks: [harbor-backend]
        # compose names the project after project_src, which is
        # dir.ansible/harbor on this host
        expected_project: harbor
        expected_services:
          - core
          - exporter
          - jobservice
          - portal
          - proxy
          - registry
          - registryctl
          - trivy-adapter
        expected_trivy: true
        expected_metrics: true
        expected_exporter_labels:
          prometheus.io.path: /metrics
          prometheus.io.port: "8080"
          prometheus.io.instance: harbor-default-harbor
        expected_proxy_ports: {}
        expected_syslog: false
        # every network the proxy is on, which is the internal one alone here
        expected_proxy_networks: [harbor]
        # one network carries both backends, so a backend component lands on two
        expected_core_networks: [harbor, harbor-backend]
        expected_jobservice_networks: [harbor, harbor-backend]
        expected_external_url: https://harbor-default.molecule
        expected_log_level: info
        expected_job_workers: 10
        # read back out of the generated component config, so it proves the
        # template reached harbor and not just the file on disk
        expected_db_host: postgres
        expected_redis_host: redis:6379

      harbor-moved:
        molecule_db_network: harbor-db
        redis:
          image: redis
          version: 8.10-alpine
          password: molecule-redis-pass
          # its own network, so db and redis are two separate attachments here
          network: harbor-cache
          config: ""
          overcommit_memory: false
          exporter:
            enabled: false
            image: oliver006/redis_exporter
            version: v1.89.0
          directories:
            ansible: "{{ dir.ansible }}/redis"
            data: "{{ dir.data }}/redis"

        harbor:
          version: "2.15.2"
          hostname: harbor-moved.molecule
          # set outright rather than derived from hostname, and on a port, which
          # is the case the default cannot produce
          external_url: https://registry.molecule:8443
          admin_password: molecule-admin-pass
          network: harbor-second
          listen_ips:
            - "127.0.0.1:18080:8080"
          networks:
            - traefik-molecule
          syslog:
            enabled: false
            # not 1514: the default is published on 127.0.0.1 of the instance,
            # and moving it is the only way a second harbor could share a host
            port: 11514
          db:
            host: postgres
            port: 5432
            name: harbor
            username: harbor
            password: molecule-db-pass
            network: harbor-db
          redis:
            host: redis
            port: 6379
            password: molecule-redis-pass
            network: harbor-cache
          # off, which drops the trivy-adapter container and runs prepare
          # without --with-trivy
          trivy:
            enabled: false
            skip_update: false
            security_check: "vuln,config,secret"
            github_token: ""
          metrics:
            enabled: false
          # Pushed all the way through: tests.yml reads the generated
          # common/config files out of the instance, so this proves `config`
          # reaches harbor's own configuration and not just harbor.yml.
          config:
            log:
              level: debug
            jobservice:
              max_job_workers: 3
          directories:
            ansible: "{{ dir.ansible }}/harbor-moved"
            data: "{{ dir.data }}/harbor-moved"
            logs: /var/log/harbor-moved

        expected_compose_dir: /data/ansible/harbor-moved
        expected_data_dir: /data/harbor-moved
        expected_logs_dir: /var/log/harbor-moved
        expected_network: harbor-second
        expected_backend_networks: [harbor-db, harbor-cache]
        # directories.ansible is relocated here, and compose names the project
        # after it - so this name also proves the move took effect
        expected_project: harbor-moved
        expected_services:
          - core
          - jobservice
          - portal
          - proxy
          - registry
          - registryctl
        expected_trivy: false
        expected_metrics: false
        expected_exporter_labels: {}
        expected_proxy_ports:
          "8080/tcp":
            - HostIp: 127.0.0.1
              HostPort: "18080"
        expected_syslog: false
        expected_proxy_networks: [harbor-second, traefik-molecule]
        # two separate backends here, so every backend component lands on three
        expected_core_networks: [harbor-second, harbor-db, harbor-cache]
        expected_jobservice_networks: [harbor-second, harbor-db, harbor-cache]
        expected_external_url: https://registry.molecule:8443
        expected_log_level: debug
        expected_job_workers: 3
        expected_db_host: postgres
        expected_redis_host: redis:6379
        # the default paths this host must no longer touch
        unexpected_paths:
          - /data/ansible/harbor
          - /data/harbor
          - /var/log/harbor
          # syslog is off, so nothing writes a log root at all
          - /var/log/harbor-moved
