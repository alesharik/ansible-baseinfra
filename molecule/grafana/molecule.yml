---
# Two platforms on purpose. `grafana-defaults` leaves everything but the
# required `admin_password` alone, so it runs the real role defaults and cannot
# drift from them, and it is where the auth assertions live - anonymous access
# is off there, so a login either used the password from the secret or it did
# not. `grafana-custom` moves both directories, sets `env`, and - via
# side_effect.yml - disables the default network. The shared converge.yml
# includes the role by scenario name, so a second scenario is not an option -
# a scenario is a role name here.
platforms:
  - name: grafana-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    dns_servers: ["192.168.3.1"]
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: grafana-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    dns_servers: ["192.168.3.1"]
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # grafana's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
        # the port grafana listens on inside the container
        molecule_http_port: 3000
        # what the role is told to set, and what tests.yml logs in with
        molecule_admin_password: molecule-secret-pw
        # grafana's own built-in default. It is what an instance ends up with
        # when it cannot read the secret file, so a successful login with this
        # means the password the role wrote never reached grafana.
        molecule_fallback_password: admin
    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `grafana`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      grafana-defaults:
        # `grafana` is a wholesale dict override and `admin_password` has no
        # default, so this host cannot just leave the dict unset the way
        # loki-defaults and mimir-defaults do - naming the one required key
        # would drop every other. The values below are the role defaults,
        # copied, plus that key. tests.yml asserts the copy still equals
        # roles/grafana/defaults/main.yaml, so it cannot silently drift away
        # from what it claims to pin.
        grafana:
          image: grafana/grafana-oss
          version: 13.0.2
          admin_password: molecule-secret-pw
          networks: []
          disable_default_network: false
          env: []
          directories:
            ansible: "{{ dir.ansible }}/grafana"
            data: "{{ dir.data }}/grafana"
        expected_compose_dir: /data/ansible/grafana
        expected_data_dir: /data/grafana
        # `env` defaults to [], so only the secret pointer is in the environment
        expected_env:
          - "GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/admin_password"
        # anonymous auth is off here, which is what makes the login assertions
        # mean anything - with it on, every request answers 200 regardless
        expect_anonymous: false
        expect_network_mode_none: false
        # compose names the project after project_src, so this is the network it
        # creates for the role when the flag is off
        expected_networks:
          - grafana_default
      grafana-custom:
        grafana:
          image: grafana/grafana-oss
          version: 13.0.2
          admin_password: molecule-secret-pw
          # converge runs with the default network on; side_effect.yml flips
          # both of these and re-runs the role, so verify sees the disabled
          # state on this host and the default state on grafana-defaults
          networks: []
          disable_default_network: false
          # Not inert, deliberately: this is a setting only grafana itself acts
          # on, so an unauthenticated request answering 200 on this host and 401
          # on the other proves `env` reached the process, not just docker.
          env:
            - "GF_AUTH_ANONYMOUS_ENABLED=true"
            - "GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer"
          # Both are off the role default, and neither is a prefix of where the
          # role would otherwise write.
          directories:
            ansible: /data/ansible/dashboards/grafana
            data: /data/grafana-storage
        expected_compose_dir: /data/ansible/dashboards/grafana
        expected_data_dir: /data/grafana-storage
        expected_env:
          - "GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/admin_password"
          - "GF_AUTH_ANONYMOUS_ENABLED=true"
          - "GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer"
        expect_anonymous: true
        expect_network_mode_none: true
        expected_networks:
          - molecule-grafana
        # side_effect.yml creates this network and re-runs the role attached to
        # it; a service on the `none` default network cannot start, so the
        # disabled state is only reachable with an external network to move to
        molecule_external_network: molecule-grafana
        # paths the role must NOT have touched - the defaults it no longer uses
        unexpected_paths:
          - /data/ansible/grafana
          - /data/grafana
