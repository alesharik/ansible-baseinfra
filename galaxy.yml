---
namespace: alesharik
name: baseinfra
version: 1.0.0
readme: README.md
authors:
  - Aleksei Arsenev <alesharik4@gmail.com>
description: Collection with basic roles for my infrastructure. Not intended for public use
license:
  - Apache-2.0
tags:
  - infrastructure
  - linux
  - database
  - monitoring
dependencies:
  community.docker: "*"
  # redis and valkey set vm.overcommit_memory through ansible.posix.sysctl
  ansible.posix: "*"
  # etcd builds its own CA and issues server, peer and client certificates
  community.crypto: "*"
  # postgres manages users, databases and grants
  community.postgresql: "*"
repository: https://github.com/alesharik/ansible-baseinfra
issues: https://github.com/alesharik/ansible-baseinfra/issues
build_ignore:
  - idea/*
