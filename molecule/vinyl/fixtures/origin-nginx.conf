events {}
http {
    access_log /dev/stdout;

    # Every response echoes back what the origin actually saw, so the tests can
    # assert on the TLS the connector originated rather than on varnish's word
    # for it. nginx does not inherit add_header into a location that declares
    # its own, so each location repeats them instead of setting them once here.
    server {
        listen 443 ssl;
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /certs/origin.crt;
        ssl_certificate_key /certs/origin.key;

        # $request_id is unique per request, so an identical body across two
        # responses is proof the second one never reached the origin.
        location /cached {
            add_header X-Origin-Sni        "$ssl_server_name" always;
            add_header X-Origin-Scheme     "$scheme" always;
            add_header X-Origin-Port       "$server_port" always;
            add_header X-Origin-Host       "$host" always;
            add_header X-Origin-Saw-Target "[$http_x_vinyl_target]" always;
            add_header X-Origin-Saw-Port   "[$http_x_vinyl_port]" always;
            add_header X-Origin-Saw-Sni    "[$http_x_vinyl_sni]" always;
            add_header Cache-Control       "public, max-age=600" always;
            default_type text/plain;
            return 200 "cached req=$request_id\n";
        }

        # served with a Set-Cookie the VCL is expected to strip before caching
        location /asset.css {
            add_header X-Origin-Sni    "$ssl_server_name" always;
            add_header X-Origin-Scheme "$scheme" always;
            add_header X-Origin-Port   "$server_port" always;
            add_header Cache-Control   "public, max-age=600" always;
            add_header Set-Cookie      "sessid=molecule; Path=/" always;
            default_type text/css;
            return 200 "body{} req=$request_id\n";
        }

        location / {
            add_header X-Origin-Sni        "$ssl_server_name" always;
            add_header X-Origin-Scheme     "$scheme" always;
            add_header X-Origin-Port       "$server_port" always;
            add_header X-Origin-Host       "$host" always;
            add_header X-Origin-Saw-Target "[$http_x_vinyl_target]" always;
            add_header X-Origin-Saw-Port   "[$http_x_vinyl_port]" always;
            add_header X-Origin-Saw-Sni    "[$http_x_vinyl_sni]" always;
            default_type text/plain;
            return 200 "root req=$request_id\n";
        }
    }
}
