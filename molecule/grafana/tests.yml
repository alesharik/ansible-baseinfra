---
# --- defaults have not drifted from what this scenario pins ------------------
# grafana-defaults copies roles/grafana/defaults/main.yaml into host_vars,
# because `grafana` is a wholesale dict override and `admin_password` has to be
# supplied. That copy is only worth anything if it still matches the role.
# `directories` is left out of the comparison: the defaults file holds it as raw
# `{{ dir.* }}` templates, and the host_vars copy has already been resolved by
# the time this runs. The expected_* paths below pin where it landed instead.
- name: Read the role defaults from the controller
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/roles/grafana/defaults/main.yaml"
  delegate_to: localhost
  become: false
  register: role_defaults_raw
  when: inventory_hostname == 'grafana-defaults'

- name: Check the pinned copy still equals the role defaults
  vars:
    role_defaults: "{{ role_defaults_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - role_defaults.grafana.image == grafana.image
      - role_defaults.grafana.version == grafana.version
      - role_defaults.grafana.env == grafana.env
      - role_defaults.grafana.networks == grafana.networks
      - role_defaults.grafana.disable_default_network == grafana.disable_default_network
      # the role has nothing to fall back to for this, so it must stay unset -
      # a default here would be one shared password across every deployment
      - role_defaults.grafana.admin_password is not defined
    fail_msg: >-
      roles/grafana/defaults/main.yaml has changed - the "defaults" host is
      pinning something else now
  when: inventory_hostname == 'grafana-defaults'

# --- every directory in the var, and nothing outside it ----------------------
- name: Stat the directories the role should have created
  ansible.builtin.stat:
    path: "{{ item }}"
  register: grafana_dirs
  loop:
    - "{{ expected_compose_dir }}"
    - "{{ expected_data_dir }}"

- name: Check each directory exists
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    fail_msg: "{{ item.item }} is not a directory"
  loop: "{{ grafana_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check the data dir is owned by the uid grafana runs as
  vars:
    data_dir: "{{ grafana_dirs.results | selectattr('item', 'eq', expected_data_dir) | first }}"
  ansible.builtin.assert:
    that:
      - data_dir.stat.uid == 472
    fail_msg: "{{ expected_data_dir }} is owned by uid {{ data_dir.stat.uid }}, expected 472"

# the whole point of the vars: a path still derived from dir.ansible/dir.data
# would show up here even though every assertion above passed
- name: Stat the default paths the role must no longer use
  ansible.builtin.stat:
    path: "{{ item }}"
  register: grafana_default_paths
  loop: "{{ unexpected_paths | default([]) }}"

- name: Check the role wrote nothing outside grafana.directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      {{ item.item }} exists - something in the role still derives its path from
      dir.ansible/dir.data instead of grafana.directories
  loop: "{{ grafana_default_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

# --- the admin password file -------------------------------------------------
# Compose bind-mounts a `secrets: file:` entry, so the host ownership is what the
# container sees and grafana runs as uid 472. Root-owned 0400 is unreadable to
# it, and grafana then falls back to its built-in default password without
# logging anything - see the login assertions at the end, which is where that
# actually gets caught.
- name: Stat the admin password file
  ansible.builtin.stat:
    path: "{{ expected_compose_dir }}/admin_password.txt"
  register: grafana_password_file

- name: Check the password file is readable by grafana and nobody else
  ansible.builtin.assert:
    that:
      - grafana_password_file.stat.exists
      - grafana_password_file.stat.mode == '0400'
      - grafana_password_file.stat.uid == 472
    fail_msg: >-
      admin_password.txt is mode {{ grafana_password_file.stat.mode }} owned by
      uid {{ grafana_password_file.stat.uid }} - expected 0400 and 472, or
      grafana cannot read its own password

- name: Read the admin password file
  ansible.builtin.slurp:
    src: "{{ expected_compose_dir }}/admin_password.txt"
  register: grafana_password_raw
  no_log: true

- name: Check the file holds the password the role was given
  vars:
    written: "{{ grafana_password_raw.content | b64decode | trim }}"
  ansible.builtin.assert:
    that:
      - written == molecule_admin_password
    fail_msg: admin_password.txt does not hold the password the role was configured with
  no_log: true

# --- docker-compose.yml ------------------------------------------------------
- name: Read the rendered docker-compose.yml
  ansible.builtin.slurp:
    src: "{{ expected_compose_dir }}/docker-compose.yml"
  register: grafana_compose_raw

- name: Check compose mounts the data dir and wires up the secret
  vars:
    compose: "{{ grafana_compose_raw.content | b64decode | from_yaml }}"
    service: "{{ compose.services.grafana }}"
  ansible.builtin.assert:
    that:
      - compose.services | list == ['grafana']
      # deliberately unset: a hardcoded container_name is global to the daemon,
      # so it collides with anything else already holding the name and ignores
      # the project namespacing compose gives the container for free
      - service.container_name is not defined
      - "expected_data_dir ~ ':/var/lib/grafana' in service.volumes"
      - service.secrets == ['admin_password']
      # relative, so compose resolves it against the compose file's own
      # directory - which is why the path is not a var of its own
      - compose.secrets.admin_password.file == 'admin_password.txt'
    fail_msg: "compose renders the grafana service as {{ service }}"

- name: Check env reached the compose environment
  vars:
    compose: "{{ grafana_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      # list form, not a mapping: `env` lines are already KEY=value and compose
      # takes one style or the other
      - compose.services.grafana.environment == expected_env
    fail_msg: >-
      compose environment is
      {{ compose.services.grafana.environment | default('<unset>') }},
      expected {{ expected_env }}

# the point of handing it over as a secret rather than an env var
- name: Check the password is not in the compose environment
  vars:
    compose: "{{ grafana_compose_raw.content | b64decode | from_yaml }}"
    env_blob: "{{ compose.services.grafana.environment | join(' ') }}"
  ansible.builtin.assert:
    that:
      - molecule_admin_password not in env_blob
    fail_msg: the admin password is in the compose environment instead of the secret

# --- disable_default_network -------------------------------------------------
# grafana-defaults names no networks and leaves the flag off, so the template
# must emit no top-level networks mapping at all. grafana-custom was re-run by
# side_effect.yml with the flag on and one external network.
- name: Check no networks are declared when the flag is off
  vars:
    compose: "{{ grafana_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - compose.networks is not defined
    fail_msg: >-
      compose declares networks {{ compose.networks | default({}) }} on a host
      that names none and leaves disable_default_network off
  when: not expect_network_mode_none

# spelled out rather than derived from grafana.networks: an expectation built
# from the same var the template reads would agree with a broken template
- name: Check the flag points the default network at none
  vars:
    compose: "{{ grafana_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - "compose.networks['default'] == {'external': true, 'name': 'none'}"
      - "compose.networks['molecule-grafana'] == {'external': true, 'name': 'molecule-grafana'}"
      # the external network has to survive alongside default, not replace it -
      # a service left on the default network could not start at all
      - "compose.services.grafana.networks == ['molecule-grafana']"
    fail_msg: "compose networks are {{ compose.networks | default('<unset>') }}"
  when: expect_network_mode_none

# --- the container actually runs the config it was handed --------------------
# The compose file sets no container_name, so the container is named after the
# project - which follows the compose dir and is not something the test can
# spell. Find it by the labels compose stamps on it instead; working_dir is the
# one that stays exact when the directories move.
- name: Find the grafana container by its compose labels
  ansible.builtin.command: >-
    docker ps --quiet --no-trunc
    --filter label=com.docker.compose.project.working_dir={{ expected_compose_dir }}
    --filter label=com.docker.compose.service=grafana
  register: grafana_container_id
  changed_when: false
  retries: 30
  delay: 5
  until: grafana_container_id.rc == 0 and grafana_container_id.stdout_lines | length == 1

- name: Wait for the grafana container to report running
  ansible.builtin.command: "docker inspect {{ grafana_container_id.stdout_lines[0] }}"
  register: grafana_inspect_raw
  changed_when: false
  retries: 30
  delay: 5
  # `and` short-circuits, so from_json never sees an empty stdout
  until: >-
    grafana_inspect_raw.rc == 0 and
    (grafana_inspect_raw.stdout | from_json)[0].State.Running

# the rendered file only proves the template; this proves docker acted on it
- name: Check docker bound the data dir and mounted the secret
  vars:
    inspected: "{{ (grafana_inspect_raw.stdout | from_json)[0] }}"
    binds: "{{ inspected.HostConfig.Binds | default([]) }}"
    # docker appends the access mode, so a bind reads host:container:rw here
    bind_paths: "{{ binds | map('regex_replace', '^([^:]+:[^:]+).*$', '\\1') | list }}"
    destinations: "{{ inspected.Mounts | map(attribute='Destination') | list }}"
  ansible.builtin.assert:
    that:
      - "expected_data_dir ~ ':/var/lib/grafana' in bind_paths"
      - "'/run/secrets/admin_password' in destinations"
    fail_msg: "docker bound {{ binds }} and mounted {{ destinations }}"

- name: Check the container joined the expected networks
  vars:
    nets: "{{ (grafana_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks | list }}"
  ansible.builtin.assert:
    that:
      - nets == expected_networks
    fail_msg: "container is attached to {{ nets }}, expected {{ expected_networks }}"

- name: Check env reached the container environment
  vars:
    container_env: "{{ (grafana_inspect_raw.stdout | from_json)[0].Config.Env }}"
  ansible.builtin.assert:
    that:
      - expected_env | difference(container_env) | length == 0
      # `docker inspect` is the thing the secret keeps the password out of
      - molecule_admin_password not in (container_env | join(' '))
    fail_msg: "container environment is {{ container_env }}"

# --- grafana answers, with the password the role wrote -----------------------
# grafana publishes no ports, so this goes to the container's own address on
# whichever network it ended up attached to
- name: Read the container address
  vars:
    networks: "{{ (grafana_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks }}"
  ansible.builtin.set_fact:
    grafana_ip: "{{ networks[expected_networks[0]].IPAddress }}"

- name: Wait for grafana to report healthy
  ansible.builtin.uri:
    url: "http://{{ grafana_ip }}:{{ molecule_http_port }}/api/health"
    return_content: true
  register: grafana_health
  retries: 40
  delay: 5
  until: >-
    grafana_health.json is defined and
    grafana_health.json.database | default('') == 'ok'

- name: Check grafana reports the version the role pinned
  vars:
    compose: "{{ grafana_compose_raw.content | b64decode | from_yaml }}"
    image_tag: "{{ compose.services.grafana.image | regex_replace('^.*:', '') }}"
  ansible.builtin.assert:
    that:
      - grafana_health.json.version == image_tag
    fail_msg: >-
      grafana reports {{ grafana_health.json.version }} but compose pins
      {{ image_tag }}

# the end-to-end assertion for the secret: this only answers 200 if grafana read
# the file the role wrote, out of the mount compose made for it
- name: Log in with the password the role wrote
  ansible.builtin.uri:
    url: "http://{{ grafana_ip }}:{{ molecule_http_port }}/api/org"
    url_username: admin
    url_password: "{{ molecule_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: grafana_authed
  no_log: true

- name: Check the login was accepted
  ansible.builtin.assert:
    that:
      - grafana_authed.status == 200
    fail_msg: grafana rejected the password the role wrote into the secret

# The bug this is here for: grafana falls back to its built-in default password
# when it cannot read the secret, and says nothing about it. Every assertion
# above still passes in that state - the file is on disk with the right mode,
# compose mounts it, the container is running - so this is the only thing that
# catches it. Skipped where anonymous auth is on, since that answers 200 for
# any request and would make this vacuous.
- name: Try to log in with grafana's built-in default password
  ansible.builtin.uri:
    url: "http://{{ grafana_ip }}:{{ molecule_http_port }}/api/org"
    url_username: admin
    url_password: "{{ molecule_fallback_password }}"
    force_basic_auth: true
    status_code: 401
  register: grafana_fallback
  when: not expect_anonymous

- name: Check the built-in default password was rejected
  ansible.builtin.assert:
    that:
      - grafana_fallback.status == 401
    fail_msg: >-
      admin/{{ molecule_fallback_password }} was accepted - grafana never read
      the secret and is running on its built-in default password
  when: not expect_anonymous

# --- env reached grafana itself, not just docker -----------------------------
# GF_AUTH_ANONYMOUS_ENABLED is set on grafana-custom only, and nothing but
# grafana acts on it, so the two hosts have to answer differently here
- name: Request without credentials
  ansible.builtin.uri:
    url: "http://{{ grafana_ip }}:{{ molecule_http_port }}/api/org"
    status_code: [200, 401]
  register: grafana_anon

- name: Check anonymous access follows the env the role passed through
  ansible.builtin.assert:
    that:
      - grafana_anon.status == (expect_anonymous | ternary(200, 401))
    fail_msg: >-
      unauthenticated /api/org answered {{ grafana_anon.status }} with
      expect_anonymous={{ expect_anonymous }} - GF_AUTH_ANONYMOUS_ENABLED did
      not reach grafana
