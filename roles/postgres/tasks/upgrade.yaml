---
# pg_upgrade --link from <data>/<old>/docker to <data>/<new>/docker. Hard links
# need both clusters on one filesystem, which is why the whole data dir is one
# mount. The old cluster stays on disk until the operator removes it.
- name: Stop on a standby with an older cluster
  tags: postgres
  ansible.builtin.fail:
    msg: >-
      {{ postgres.directories.data }}/{{ postgres_upgrade_from }}/docker is a
      PostgreSQL {{ postgres_upgrade_from }} standby, and pg_upgrade cannot upgrade
      a standby. Upgrade the primary first. Then stop this project, move
      {{ postgres.directories.data }}/{{ postgres_upgrade_from }} out of the data
      dir, and run the role again: it takes a new base backup from the primary.
  when: postgres.mode == 'standby'

# With packages, the stock upgrade image has none of the libraries the old
# cluster references, and pg_upgrade stops. So the role builds its own.
- name: Move the upgrade Dockerfile
  tags: postgres
  ansible.builtin.template:
    src: Dockerfile.upgrade
    dest: "{{ postgres.directories.ansible }}/Dockerfile.upgrade"
    mode: "0444"
  when: postgres.packages | length > 0

- name: Read the upgrade Dockerfile checksum
  tags: postgres
  ansible.builtin.stat:
    path: "{{ postgres.directories.ansible }}/Dockerfile.upgrade"
    checksum_algorithm: sha1
  register: postgres_upgrade_dockerfile
  when: postgres.packages | length > 0

# One name for both branches, so the pg_upgrade task below reads one var.
- name: Name the upgrade image
  tags: postgres
  ansible.builtin.set_fact:
    postgres_upgrade_tag: >-
      {{ ('baseinfra-postgres-upgrade:' ~ postgres_upgrade_from ~ '-to-' ~ postgres_major
          ~ '-' ~ postgres_upgrade_dockerfile.stat.checksum[:12])
         if postgres.packages | length > 0
         else (postgres.upgrade_image ~ ':' ~ postgres_upgrade_from ~ '-to-' ~ postgres_major) }}

# Before the stop: a missing tag or a registry outage must not leave the server
# down with nothing to show for it.
- name: Pull the upgrade image
  tags: postgres
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ postgres_upgrade_tag }}"
  register: postgres_upgrade_pull
  changed_when: "'Downloaded newer image' in postgres_upgrade_pull.stdout"
  when: postgres.packages | length == 0

# The build is skipped when the tag is already there, so a second run over the
# same state changes nothing.
- name: Look for the upgrade image
  tags: postgres
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ postgres_upgrade_tag }}"
  register: postgres_upgrade_image_found
  changed_when: false
  failed_when: false
  when: postgres.packages | length > 0

# --pull, so this reaches the registry like the docker pull it replaces, and
# still fails before the server stops.
- name: Build the upgrade image
  tags: postgres
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --pull
      - --file
      - "{{ postgres.directories.ansible }}/Dockerfile.upgrade"
      - --tag
      - "{{ postgres_upgrade_tag }}"
      - "{{ postgres.directories.ansible }}"
  changed_when: true
  when:
    - postgres.packages | length > 0
    - postgres_upgrade_image_found.rc != 0

# Not docker_compose_v2 `state: stopped`: that runs `up --no-start` first, which
# would recreate the container on the new image. The old server has to stop
# cleanly, on its own image.
- name: Stop postgres for the upgrade
  tags: postgres
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ postgres.directories.ansible }}"
      - stop
      - --timeout
      - "120"
  changed_when: true

# initdb of the new cluster must match the old one: the same bootstrap superuser
# (pg_upgrade connects as it) and the same data checksum setting, which
# pg_upgrade checks. 18 turns checksums on by default and is the first version
# with --no-data-checksums, so the flag depends on both sides. PG_MAJOR in the
# upgrade image is the new major.
#
# PGPASSWORD is only for a cluster whose own pg_hba.conf asks for a password on
# the socket, like one from the old role. It comes from the task environment:
# that keeps it out of the docker command line and out of the container config,
# but ansible still passes it in the environment of the command it runs.
- name: Run pg_upgrade
  tags: postgres
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ postgres.directories.data }}:/var/lib/postgresql"
      - --env
      - "PGDATAOLD=/var/lib/postgresql/{{ postgres_upgrade_from }}/docker"
      - --env
      - "PGDATANEW=/var/lib/postgresql/{{ postgres_major }}/upgrading"
      - --env
      - "POSTGRES_INITDB_ARGS=--username={{ postgres.username }}"
      - --env
      - "PGUSER={{ postgres.username }}"
      - --env
      - PGPASSWORD
      - --entrypoint
      - sh
      - "{{ postgres_upgrade_tag }}"
      - -c
      - |
        set -e
        if "$PGBINOLD/pg_controldata" "$PGDATAOLD" | grep -Eq '^Data page checksum version:[[:space:]]+0$'; then
          if [ "$PG_MAJOR" -ge 18 ]; then
            POSTGRES_INITDB_ARGS="$POSTGRES_INITDB_ARGS --no-data-checksums"
          fi
        else
          POSTGRES_INITDB_ARGS="$POSTGRES_INITDB_ARGS --data-checksums"
        fi
        export POSTGRES_INITDB_ARGS
        exec docker-upgrade pg_upgrade --link
  environment:
    PGPASSWORD: "{{ postgres.password }}"
  changed_when: true

- name: Move the upgraded cluster into place
  tags: postgres
  ansible.builtin.command:
    argv:
      - mv
      - "{{ postgres.directories.data }}/{{ postgres_major }}/upgrading"
      - "{{ postgres.directories.data }}/{{ postgres_major }}/docker"
  changed_when: true

# Outside the cluster, so the server never sees it. main.yaml runs the analyze
# and removes the marker - on this run, or on the next one if this one fails.
- name: Leave a marker for the analyze
  tags: postgres
  ansible.builtin.copy:
    dest: "{{ postgres.directories.data }}/{{ postgres_major }}/analyze_pending"
    content: ""
    mode: "0600"
