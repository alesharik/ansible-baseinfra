---
# Every key below is set by the role from a var that also decides something else
# - a published port, an external network, the address written into the cluster
# metadata. Setting one through `config` would move the broker's idea of it
# without moving the publication or the mount with it, and the only symptom
# would be a broker that does not come up.
- name: Check no extra config entry collides with a setting the role owns
  tags: pulsar
  vars:
    pulsar_managed_keys:
      - clusterName
      - metadataStoreUrl
      - configurationMetadataStoreUrl
      - bookkeeperMetadataServiceUri
      - advertisedAddress
      - brokerServicePort
      - webServicePort
      - managedLedgerDefaultEnsembleSize
      - managedLedgerDefaultWriteQuorum
      - managedLedgerDefaultAckQuorum
      - functionsWorkerEnabled
  ansible.builtin.assert:
    that:
      - pulsar.config | list | intersect(pulsar_managed_keys) | length == 0
    fail_msg: >-
      pulsar.config sets
      {{ pulsar.config | list | intersect(pulsar_managed_keys) }}, which the role
      sets itself from its own vars. Those vars also decide what is published and
      which networks the broker joins, so overriding the setting alone leaves the
      two disagreeing. Use the var instead.

# A write goes to `ensemble_size` bookies, `write_quorum` of them hold each entry
# and `ack_quorum` have to answer before it counts - so the sizes only make sense
# in that order, and a broker asking for more bookies than the cluster has cannot
# create a topic at all.
- name: Check the managed ledger replication sizes make sense
  tags: pulsar
  vars:
    pulsar_ml: "{{ pulsar.managed_ledger }}"
  ansible.builtin.assert:
    that:
      - pulsar_ml.ensemble_size | int >= pulsar_ml.write_quorum | int
      - pulsar_ml.write_quorum | int >= pulsar_ml.ack_quorum | int
      - pulsar_ml.ack_quorum | int >= 1
    fail_msg: >-
      pulsar.managed_ledger is ensemble {{ pulsar_ml.ensemble_size }}, write
      quorum {{ pulsar_ml.write_quorum }}, ack quorum {{ pulsar_ml.ack_quorum }}.
      They have to fall in that order, each at least 1, and the ensemble needs
      that many bookies in the cluster.

# The cluster name is a path segment in the metadata (/admin/clusters/<name>) and
# goes into every broker's configuration. Whitespace or a slash in it would split
# that path, and the failure would surface as a broker that cannot find its own
# cluster rather than as anything about this var.
- name: Check the cluster name is a single usable token
  tags: pulsar
  ansible.builtin.assert:
    that:
      - pulsar.cluster_name | length > 0
      - pulsar.cluster_name is not search('[\s/]')
    fail_msg: >-
      pulsar.cluster_name is "{{ pulsar.cluster_name }}"; it has to be a
      non-empty name with no whitespace and no slash - it is a path segment in
      the metadata store.

# A package replica is a ledger like any other, so it is bound by the same bookie
# count the managed ledger sizes are. Asking for more copies than the cluster can
# hold makes every function upload fail, well after this role has reported
# success.
- name: Check the function package replica count fits the cluster
  tags: pulsar
  when: pulsar.functions_worker.enabled
  ansible.builtin.assert:
    that:
      - pulsar.functions_worker.num_package_replicas | int >= 1
      - pulsar.functions_worker.num_package_replicas | int <= pulsar.managed_ledger.ensemble_size | int
      - pulsar.functions_worker.state_storage_url | length > 0
    fail_msg: >-
      pulsar.functions_worker asks for
      {{ pulsar.functions_worker.num_package_replicas }} package replicas against
      a managed ledger ensemble of {{ pulsar.managed_ledger.ensemble_size }}, and
      keeps state at "{{ pulsar.functions_worker.state_storage_url }}". The
      replicas are ledgers, so they need that many bookies, and the state storage
      url is bookkeeper's table service - a bookkeeper deployed without
      stream_storage has nothing listening on it.
