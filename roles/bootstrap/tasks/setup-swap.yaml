---
- name: Ensure swap exists
  ansible.builtin.command: swapon --show=SIZE --bytes --noheadings
  register: bootstrap_swap_exists
  changed_when: false
  tags: bootstrap

- name: Exists
  ansible.builtin.debug:
    msg: "swap_size_mb: {{ (bootstrap_swap_exists.stdout_lines | map('trim') | map('int') | sum / 1024 / 1024) | round | int }}"
  when: bootstrap_swap_exists.stdout is defined and bootstrap_swap_exists.stdout | length > 1
  tags: bootstrap

# if the swap exists and the size is not equal to swap_file_size_mb
- name: If swap exists and size differs
  when: >
    (bootstrap_swap_exists.stdout is defined and bootstrap_swap_exists.stdout | length > 1)
      and ((bootstrap_swap_exists.stdout_lines | map('trim') | map('int') | sum / 1024 / 1024) | round | int != bootstrap.swap.size_mb | int)
  tags: bootstrap
  block:
    - name: Disable old swap
      ansible.builtin.systemd:
        state: stopped
        name: swapfile.swap
    - name: Remove swap file
      ansible.builtin.file:
        path: "{{ bootstrap.swap.file }}"
        state: absent

# if the swap does not exist
- name: If swap does not exist
  when: >
    (bootstrap_swap_exists.stdout is defined and bootstrap_swap_exists.stdout | length < 1)
      or (bootstrap_swap_exists.stdout_lines is defined
        and (bootstrap_swap_exists.stdout_lines | map('trim') | map('int') | sum / 1024 / 1024) | round | int != bootstrap.swap.size_mb | int)
  tags: bootstrap
  block:
    - name: Create swap file
      ansible.builtin.command:
        cmd: dd if=/dev/zero of={{ bootstrap.swap.file }} bs=1M count={{ bootstrap.swap.size_mb }}
        creates: "{{ bootstrap.swap.file }}"

    - name: Set permissions on file
      ansible.builtin.file:
        path: "{{ bootstrap.swap.file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Make swap file
      ansible.builtin.command: mkswap {{ bootstrap.swap.file }}
      register: bootstrap_mkswap_result
      changed_when: bootstrap_mkswap_result.rc != 0

    - name: Setup systemd unut
      ansible.builtin.template:
        src: swapfile.swap
        dest: /etc/systemd/system/{{ bootstrap.swap.file[1:] }}.swap
        mode: "0755"

    - name: Enable
      ansible.builtin.systemd:
        state: started
        name: swapfile.swap
        enabled: true
        daemon_reload: true
