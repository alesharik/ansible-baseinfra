---
# The image's entrypoint expands ZOO_CFG_EXTRA with `for e in $ZOO_CFG_EXTRA`, so
# it word-splits on whitespace and writes one zoo.cfg line per word. An entry
# with a space in it would silently become two directives, neither of them the
# one that was meant - fail here, where the cause has a name.
- name: Check every extra config entry is a single directive
  tags: zookeeper
  ansible.builtin.assert:
    that:
      - item is not search('\s')
      - item is search('=')
    fail_msg: >-
      zookeeper.config entry "{{ item }}" is not a single key=value directive.
      The entrypoint splits this list on whitespace and writes one zoo.cfg line
      per word, so an entry containing a space becomes two broken directives.
  loop: "{{ zookeeper.config }}"

# The healthcheck is `ruok`, and four letter words that are not whitelisted are
# answered with an error rather than refused - so a container that dropped ruok
# would come up and then never pass its healthcheck, which is an obscure way to
# discover a typo in this list.
- name: Check the healthcheck's four letter word is whitelisted
  tags: zookeeper
  vars:
    zookeeper_lw: "{{ zookeeper.four_lw_commands | split(',') | map('trim') | list }}"
  ansible.builtin.assert:
    that:
      - "'ruok' in zookeeper_lw or '*' in zookeeper_lw"
    fail_msg: >-
      zookeeper.four_lw_commands is "{{ zookeeper.four_lw_commands }}", which does
      not allow ruok. The container healthcheck sends ruok, so it would never
      report healthy.

- name: Check this server has a usable id
  tags: zookeeper
  ansible.builtin.assert:
    that:
      - zookeeper.id | string is match('^[0-9]+$')
      - zookeeper.id | int >= 1
      - zookeeper.id | int <= 255
    fail_msg: >-
      zookeeper.id is "{{ zookeeper.id }}"; it has to be a whole number between
      1 and 255.

# Checked across hostvars rather than per host: every member renders the whole
# server list, so a member missing a peer_ip or sharing an id breaks the ensemble
# for everyone, not just for itself.
- name: Check the ensemble is coherent
  tags: zookeeper
  when: zookeeper.quorum | length > 0
  vars:
    zookeeper_ids: >-
      {{ zookeeper.quorum | map('extract', hostvars, ['zookeeper', 'id'])
         | map('default', '') | list }}
    zookeeper_ips: >-
      {{ zookeeper.quorum | map('extract', hostvars, ['zookeeper', 'peer_ip'])
         | map('default', '') | list }}
  ansible.builtin.assert:
    that:
      - inventory_hostname in zookeeper.quorum
      - zookeeper.quorum | difference(hostvars | list) | length == 0
      - zookeeper_ips | select('equalto', '') | list | length == 0
      - zookeeper_ids | unique | length == zookeeper.quorum | length
    fail_msg: >-
      zookeeper.quorum is {{ zookeeper.quorum }}, which must contain
      {{ inventory_hostname }}, name only hosts in this play, give every member a
      peer_ip and give every member a distinct id. Members resolve to ids
      {{ zookeeper_ids }} at addresses {{ zookeeper_ips }}.
