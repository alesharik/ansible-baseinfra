---
platforms:
  - name: debian-13
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice

provisioner:
  inventory:
    group_vars:
      all:
        # bootstrap would otherwise unload a kernel module on the (shared) host
        disable_algif_aead: false
        dir:
          data: /data
          ansible: /data/ansible
