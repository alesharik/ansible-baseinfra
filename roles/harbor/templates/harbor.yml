{#
  harbor.yml, built as a mapping and dumped, rather than written out longhand.

  Harbor ships a 300-line commented harbor.yml.tmpl, and a role that vendored it
  would have to re-vendor it on every version bump. Only the keys below are
  mandatory - goharbor/prepare reads the rest with .get() and its own defaults -
  so the role writes those, and `harbor.config` is merged over the top for
  anything else, in harbor's own syntax.

  to_nice_yaml also quotes and escapes for us, which raw interpolation did not:
  a password with a `:` or a newline in it used to produce a broken file.
#}
{% set harbor_yml = {
  '_version': harbor.version.split('.')[0:2] | join('.') ~ '.0',
  'hostname': harbor.hostname,
  'external_url': harbor.external_url | default('https://' ~ harbor.hostname, true),
  'harbor_admin_password': harbor.admin_password,
  'data_volume': harbor.directories.data,
  'http': {'port': 8080},
  'internal_tls': {
    'enabled': true,
    'dir': harbor.directories.ansible ~ '/tls',
  },
  'log': {
    'level': 'info',
    'local': {
      'location': harbor.directories.logs,
      'rotate_count': 5,
      'rotate_size': '5M',
    },
  },
  'jobservice': {
    'max_job_workers': 10,
    'job_loggers': ['STD_OUTPUT'],
    'logger_sweeper_duration': 1,
  },
  'notification': {
    'webhook_job_max_retry': 3,
    'webhook_job_http_client_timeout': 3,
  },
  'metric': {
    'enabled': harbor.metrics.enabled,
    'port': 9090,
    'path': '/metrics',
  },
  'external_database': {
    'harbor': {
      'host': harbor.db.host,
      'port': harbor.db.port,
      'db_name': harbor.db.name,
      'username': harbor.db.username,
      'password': harbor.db.password,
      'ssl_mode': 'disable',
      'max_idle_conns': 2,
      'max_open_conns': 0,
    },
  },
  'external_redis': {
    'host': harbor.redis.host ~ ':' ~ harbor.redis.port,
    'password': harbor.redis.password,
    'registry_db_index': 1,
    'jobservice_db_index': 2,
    'trivy_db_index': 5,
    'idle_timeout_seconds': 30,
  },
} %}
{#- trivy off means prepare runs without --with-trivy, and a trivy block would
    only be read back on a later run that turned it on again -#}
{% if harbor.trivy.enabled %}
{% set _ = harbor_yml.update({'trivy': {
  'skip_update': harbor.trivy.skip_update,
  'security_check': harbor.trivy.security_check,
  'github_token': harbor.trivy.github_token,
  'ignore_unfixed': false,
  'offline_scan': false,
  'insecure': false,
  'timeout': '5m0s',
}}) %}
{% endif %}
{{ harbor_yml | combine(harbor.config, recursive=True) | to_nice_yaml(indent=2) }}
