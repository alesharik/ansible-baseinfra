---
# Three platforms, because the role has three modes and two of them only make
# sense together:
#
#   pg-single   the published defaults. prepare_tasks.yml deploys it on
#               PostgreSQL 16 first and writes a row, so converge meets a 16
#               cluster under an 18 image - the automatic pg_upgrade path.
#               tests.yml re-reads roles/postgres/defaults/main.yaml from the
#               controller and asserts this host's copy still matches it.
#   pg-primary  mode primary: published port, moved directories, renamed
#               network, users with grants, and a `config` entry read back from
#               the server. prepare_tasks.yml deploys it before converge, because
#               the standby takes its base backup from it during converge.
#   pg-standby  mode standby with the default directories: seeds from the
#               primary, streams from it, and runs an exporter on the login that
#               replicates from the primary.
#
# side_effect.yml adds a user without a restart, turns the exporter off, checks
# the three states the role refuses to touch, and then restores the converge
# state - so tests.yml checks one state per host.
#
# The shared converge.yml includes the role by scenario name, so a second
# scenario is not an option - a scenario is a role name here.
platforms:
  - name: pg-single
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: pg-primary
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false
  - name: pg-standby
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # postgres's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
        # the image the tests run their clients from - every host already pulled it
        expected_client_image: postgres:18.6
        expected_pgdata: /var/lib/postgresql/18/docker
        expected_server_version_min: 180000
        expected_extension_dir: /usr/share/postgresql/18/extension

    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `postgres`. Deriving the expectation from the same var
    # the templates read would let a broken template agree with a broken test.
    # The one exception is an instance address: docker assigns it, so it comes
    # from the facts of that instance.
    host_vars:
      pg-single:
        # A copy of the published defaults, with four keys changed on purpose:
        # the two passwords, because the role refuses to run without them, and
        # `packages` plus `databases`, because this host is the upgrade path and
        # pg_upgrade with a third-party extension is what it has to prove.
        # tests.yml reads roles/postgres/defaults/main.yaml from the controller
        # and asserts every other key still matches, so this copy cannot go
        # stale unnoticed.
        postgres:
          image: postgres
          version: "18.6"
          username: postgres
          password: molecule-root
          mode: single
          network: postgres
          publish: []
          config:
            session_preload_libraries: auto_explain
            auto_explain.log_min_duration: 2s
          users: []
          databases:
            - name: appdb
              extensions:
                - vector
          packages:
            - pgvector
          replication:
            password: ""
            source: ""
            host: ""
            port: 5432
          upgrade_image: tianon/postgres-upgrade
          exporter:
            enabled: true
            image: quay.io/prometheuscommunity/postgres-exporter
            version: v0.20.1
            password: molecule-exporter
          directories:
            ansible: "{{ dir.ansible }}/postgres"
            data: "{{ dir.data }}/postgres"
        # prepare_tasks.yml deploys this first, converge upgrades from it
        molecule_old_version: "16.15"

        expected_compose_dir: /data/ansible/postgres
        expected_data_dir: /data/postgres
        expected_network: postgres
        expected_container: postgres-postgres-1
        expected_exporter_container: postgres-exporter-1
        expected_compose_services: [exporter, postgres]
        expected_command:
          - postgres
          - -c
          - hba_file=/etc/postgresql/pg_hba.conf
          # `config` comes after the role's own flags, in key order
          - -c
          - auto_explain.log_min_duration=2s
          - -c
          - session_preload_libraries=auto_explain
        expected_hba:
          - local all postgres scram-sha-256
          - host postgres prom-exporter samenet scram-sha-256
        expected_mounts:
          - /data/postgres:/var/lib/postgresql
          - /data/ansible/postgres/config:/etc/postgresql
          - /data/ansible/postgres/run:/var/run/postgresql
        expected_ports: []
        expected_superuser: postgres
        expected_superuser_password: molecule-root
        expected_exporter_instance: pg-single-postgres
        # a built image: the tag is the hash of the Dockerfile, so only the
        # prefix and the shape are pinned here
        expected_image_prefix: "baseinfra-postgres:18.6-"
        expected_build: true
        expected_extensions_db: appdb
        expected_extensions:
          - vector
        expected_control_present:
          - vector.control
        expected_control_absent:
          - postgis.control

      pg-primary:
        postgres:
          image: postgres
          version: "18.6"
          username: postgres
          # A literal dollar sign on purpose - doubled here, because molecule
          # interpolates this file and reads two as one, even in comments.
          # Compose interpolates it too, so the template has to escape it. If it
          # did not, initdb would get another password and every login would fail.
          password: molecule-$$root
          mode: primary
          network: pg-main
          publish:
            - "5432"
          config:
            session_preload_libraries: auto_explain
            auto_explain.log_min_duration: 2s
            # read back from the running server by tests.yml
            work_mem: 8MB
          users:
            - name: app
              password: molecule-app
              ip: samenet
              privs:
                - db: appdb
                  type: database
                  privs: ALL
                  objs: appdb
          # otherdb gets no pg_hba line for app - tests.yml checks the refusal.
          # pg_trgm ships in the image, vector comes from the package: one
          # database holding both proves the role does not care which is which.
          databases:
            - name: appdb
              extensions:
                - pg_trgm
                - vector
            - name: otherdb
          packages:
            - pgvector
          replication:
            password: molecule-repl
            source: "{{ hostvars['pg-standby'].ansible_default_ipv4.address }}/32"
            host: ""
            port: 5432
          upgrade_image: tianon/postgres-upgrade
          exporter:
            enabled: true
            image: quay.io/prometheuscommunity/postgres-exporter
            version: v0.20.1
            password: molecule-exporter
          directories:
            ansible: "{{ dir.ansible }}/pg-main"
            data: "{{ dir.data }}/pg-main"

        expected_compose_dir: /data/ansible/pg-main
        expected_data_dir: /data/pg-main
        expected_network: pg-main
        # compose names the project after directories.ansible, so these names
        # also prove the move took effect
        expected_container: pg-main-postgres-1
        expected_exporter_container: pg-main-exporter-1
        expected_compose_services: [exporter, postgres]
        expected_command:
          - postgres
          - -c
          - hba_file=/etc/postgresql/pg_hba.conf
          - -c
          - wal_keep_size=512MB
          # `config` comes after the role's own flags, in key order
          - -c
          - auto_explain.log_min_duration=2s
          - -c
          - session_preload_libraries=auto_explain
          - -c
          - work_mem=8MB
        expected_hba:
          - local all postgres scram-sha-256
          - "host replication replication {{ hostvars['pg-standby'].ansible_default_ipv4.address }}/32 scram-sha-256"
          - host postgres prom-exporter samenet scram-sha-256
          - host appdb app samenet scram-sha-256
        expected_mounts:
          - /data/pg-main:/var/lib/postgresql
          - /data/ansible/pg-main/config:/etc/postgresql
          - /data/ansible/pg-main/run:/var/run/postgresql
        expected_ports:
          - "5432:5432"
        expected_superuser: postgres
        expected_superuser_password: molecule-$$root
        expected_exporter_instance: pg-primary-pg-main
        expected_app_password: molecule-app
        expected_work_mem: 8MB
        expected_wal_keep_size: 512MB
        expected_image_prefix: "baseinfra-postgres:18.6-"
        expected_build: true
        expected_extensions_db: appdb
        expected_extensions:
          - pg_trgm
          - vector
        expected_control_present:
          - pg_trgm.control
          - vector.control
        expected_control_absent:
          - postgis.control
        # the default paths this host must not touch
        unexpected_paths:
          - /data/ansible/postgres
          - /data/postgres

      pg-standby:
        postgres:
          image: postgres
          version: "18.6"
          username: postgres
          # the superuser replicates from the primary, so it has its password
          password: molecule-$$root
          mode: standby
          network: postgres
          publish: []
          config:
            session_preload_libraries: auto_explain
            auto_explain.log_min_duration: 2s
          users: []
          databases: []
          # Empty on purpose: this host keeps the unbuilt path under test, and
          # it shows the split - the catalog row for `vector` replicates from
          # the primary, the vector.control file does not.
          packages: []
          replication:
            password: molecule-repl
            source: ""
            host: "{{ hostvars['pg-primary'].ansible_default_ipv4.address }}"
            port: 5432
          upgrade_image: tianon/postgres-upgrade
          exporter:
            enabled: true
            image: quay.io/prometheuscommunity/postgres-exporter
            version: v0.20.1
            # the prom-exporter login replicates from the primary with this password
            password: molecule-exporter
          directories:
            ansible: "{{ dir.ansible }}/postgres"
            data: "{{ dir.data }}/postgres"

        expected_compose_dir: /data/ansible/postgres
        expected_data_dir: /data/postgres
        expected_network: postgres
        expected_container: postgres-postgres-1
        expected_exporter_container: postgres-exporter-1
        expected_compose_services: [exporter, postgres]
        # no wal_keep_size: that flag is for a primary only
        expected_command:
          - postgres
          - -c
          - hba_file=/etc/postgresql/pg_hba.conf
          # `config` comes after the role's own flags, in key order
          - -c
          - auto_explain.log_min_duration=2s
          - -c
          - session_preload_libraries=auto_explain
        # no replication line: a standby takes no replication connections
        expected_hba:
          - local all postgres scram-sha-256
          - host postgres prom-exporter samenet scram-sha-256
        expected_mounts:
          - /data/postgres:/var/lib/postgresql
          - /data/ansible/postgres/config:/etc/postgresql
          - /data/ansible/postgres/run:/var/run/postgresql
        expected_ports: []
        expected_superuser: postgres
        expected_superuser_password: molecule-$$root
        expected_exporter_instance: pg-standby-postgres
        # no build: the compose file names the image straight
        expected_image_prefix: "postgres:18.6"
        expected_build: false
        # appdb and its extension rows come over replication from pg-primary
        expected_extensions_db: appdb
        expected_extensions:
          - pg_trgm
          - vector
        expected_control_present:
          - pg_trgm.control
        expected_control_absent:
          - vector.control
