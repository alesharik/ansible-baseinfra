---
# Two platforms on purpose. `valkey-defaults` pins a copy of the published role
# defaults and tests.yml checks that copy against the defaults file itself, so
# it cannot drift - it covers the passwordless server, the default paths and the
# exporter. `valkey-custom` moves every directory, renames the network, sets a
# password, pushes directives through `config` and turns the exporter off, so
# both branches of the compose template are rendered by the converge itself and
# this scenario needs no side_effect at all. The shared converge.yml includes
# the role by scenario name, so a second scenario is not an option - a scenario
# is a role name here.
platforms:
  - name: valkey-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: valkey-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # valkey's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible

    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `valkey`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      valkey-defaults:
        # A copy of the published defaults, not a variation on them:
        # `overcommit_memory` is the single deliberate difference, because
        # vm.overcommit_memory is not namespaced and setting it here would reach
        # the kernel of whatever machine runs this scenario. tests.yml reads
        # roles/valkey/defaults/main.yaml from the controller and asserts every
        # other key still matches, so this copy cannot go stale unnoticed.
        valkey:
          image: valkey/valkey
          version: 9.1-alpine
          password: ""
          network: valkey
          config: ""
          overcommit_memory: false
          exporter:
            enabled: true
            image: oliver006/redis_exporter
            version: v1.89.0
          directories:
            ansible: "{{ dir.ansible }}/valkey"
            data: "{{ dir.data }}/valkey"

        expected_compose_dir: /data/ansible/valkey
        expected_data_dir: /data/valkey
        expected_conf: /data/ansible/valkey/valkey.conf
        expected_network: valkey
        expected_compose_services: [exporter, valkey]
        # compose names the project after project_src, which is
        # dir.ansible/valkey on this host
        expected_container: valkey-valkey-1
        expected_exporter_container: valkey-exporter-1
        expected_exporter_labels:
          prometheus.io.path: /metrics
          prometheus.io.port: "9121"
          prometheus.io.instance: valkey-defaults-valkey
        expected_mounts:
          - /data/valkey:/data
          - /data/ansible/valkey/valkey.conf:/etc/valkey/valkey.conf
        # the image this host's client containers are run from - the role
        # already pulled it, so using it costs no extra pull
        expected_image: valkey/valkey:9.1-alpine
        # unauthenticated PING against a server with no requirepass
        expected_ping: PONG

      valkey-custom:
        valkey:
          image: valkey/valkey
          version: 9.1-alpine
          password: molecule-s3cret
          network: valkey-cache
          # pushed all the way through: tests.yml asks the running server for
          # maxmemory, so this proves `config` reaches valkey and not just a file
          config: |
            maxmemory 32mb
            maxmemory-policy allkeys-lru
          overcommit_memory: false
          # off here: this is where the compose template's exporter branch is
          # covered in its absent form, and where remove_orphans has nothing to
          # leave behind
          exporter:
            enabled: false
            image: oliver006/redis_exporter
            version: v1.89.0
          directories:
            ansible: "{{ dir.ansible }}/valkey-cache"
            data: "{{ dir.data }}/valkey-cache"

        expected_compose_dir: /data/ansible/valkey-cache
        expected_data_dir: /data/valkey-cache
        expected_conf: /data/ansible/valkey-cache/valkey.conf
        expected_network: valkey-cache
        expected_compose_services: [valkey]
        # directories.ansible is relocated here, and compose names the project
        # after it - so these names also prove the move actually took effect
        expected_container: valkey-cache-valkey-1
        expected_exporter_container: valkey-cache-exporter-1
        expected_mounts:
          - /data/valkey-cache:/data
          - /data/ansible/valkey-cache/valkey.conf:/etc/valkey/valkey.conf
        expected_image: valkey/valkey:9.1-alpine
        expected_password: molecule-s3cret
        # what an unauthenticated client gets once requirepass is set
        expected_ping: NOAUTH
        # 32mb, as valkey reports it back
        expected_maxmemory: "33554432"
        # the default paths this host must no longer touch
        unexpected_paths:
          - /data/ansible/valkey
          - /data/valkey
