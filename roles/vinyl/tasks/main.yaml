---
- name: Check the vinyl settings
  tags: vinyl
  ansible.builtin.include_tasks: assert.yaml

- name: Create compose dir
  tags: vinyl
  ansible.builtin.file:
    path: "{{ vinyl.directories.ansible }}"
    state: directory
    mode: "0755"

- name: Create data dir
  tags: vinyl
  when: "vinyl.storage.startswith('file') or vinyl.storage.startswith('persistent')"
  ansible.builtin.file:
    path: "{{ vinyl.directories.data }}"
    state: directory
    mode: "0700"
    owner: '1000'

- name: Move vinyl.vcl
  tags: vinyl
  ansible.builtin.template:
    src: vinyl.vcl
    dest: "{{ vinyl.directories.ansible }}/vinyl.vcl"
    mode: "0444"
  notify:
    - reload vinyl

- name: Move haproxy.cfg
  tags: vinyl
  when: vinyl.connector.enabled
  ansible.builtin.template:
    src: haproxy.cfg
    dest: "{{ vinyl.directories.ansible }}/haproxy.cfg"
    mode: "0444"
  notify:
    - restart vinyl

- name: Move docker-varnish-entrypoint
  tags: vinyl
  ansible.builtin.template:
    src: docker-varnish-entrypoint
    dest: "{{ vinyl.directories.ansible }}/docker-varnish-entrypoint"
    mode: "0555"
  notify:
    - restart vinyl

- name: Move compose files
  tags: vinyl
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ vinyl.directories.ansible }}/docker-compose.yml"
    mode: "0700"
  notify:
    - restart vinyl

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull vinyl images
  tags: vinyl
  community.docker.docker_compose_v2_pull:
    project_src: "{{ vinyl.directories.ansible }}"
    policy: missing

# remove_orphans so that turning the connector off actually takes its container
# down - without it compose leaves a service it no longer knows about running,
# and the socket volume with it.
- name: Start vinyl
  tags: vinyl
  community.docker.docker_compose_v2:
    project_src: "{{ vinyl.directories.ansible }}"
    state: present
    remove_orphans: true

- name: Make sure handlers are flushed immediately
  ansible.builtin.meta: flush_handlers
  tags: vinyl
