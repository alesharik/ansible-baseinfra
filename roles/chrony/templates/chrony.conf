{% for source in chrony.pools %}
pool {{ source }}
{% endfor %}
driftfile /var/lib/chrony/drift
makestep {{ chrony.makestep.threshold }} {{ chrony.makestep.limit }}
rtcsync
keyfile /etc/chrony/chrony.keys
{% if chrony_version is version('4.6', '>=') %}
leapseclist /usr/share/zoneinfo/leap-seconds.list
{% else %}
leapsectz right/UTC
{% endif %}
logdir /var/log/chrony
deny all
minsources {{ chrony.minsources }}
maxupdateskew {{ chrony.maxupdateskew }}
{% if chrony.extra_config | default('', true) | trim %}

# chrony.extra_config
{{ chrony.extra_config | default('', true) | trim }}
{% endif %}
