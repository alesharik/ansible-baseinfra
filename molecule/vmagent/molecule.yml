---
# One platform, every path in `vmagent.directories` moved off its default.
# Defaults are covered implicitly by molecule/watchtower, whose "defaults" host
# runs vmagent's own layout - here the point is that nothing in the role still
# derives a path from `dir.ansible`/`dir.data` behind the vars' back. A host on
# role defaults could not tell those two apart.
platforms:
  - name: vmagent-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # vmagent's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
    host_vars:
      vmagent-custom:
        vmagent:
          image: victoriametrics/vmagent
          version: v1.101.0
          # vmagent refuses to start without at least one -remoteWrite.url.
          # Nothing listens on this one: the process stays up and retries, which
          # is all this scenario needs, and it doubles as a check that
          # `remoteWrite` still becomes a flag.
          remoteWrite:
            url: http://127.0.0.1:8428/api/v1/write
          # Both are off the role default, and neither is a prefix of where the
          # role would otherwise write.
          directories:
            ansible: /data/ansible/vm/agent
            data: /data/vm-agent-data
        # spelled out rather than derived from `vmagent`: an expectation built
        # from the same var the templates read would agree with a broken template
        expected_compose_dir: /data/ansible/vm/agent
        expected_data_dir: /data/vm-agent-data
        # neither is a var of its own - both have to follow the relocated
        # `ansible`, which is only visible because `ansible` is off its default
        expected_config_dir: /data/ansible/vm/agent/config
        expected_conf_d_dir: /data/ansible/vm/agent/config/conf.d
        # fixed on the container's side of the mount, whatever the host paths are
        expected_conf_d_glob: /etc/vmagent/conf.d/*.yml
        # literal: the scenario's vmagent dict does NOT set node_label, so this
        # flag only renders if the template's default(true) fallback works
        expected_node_label_flag: "-remoteWrite.label=node=vmagent-custom"
        # dropped into conf.d by prepare_tasks.yml, asserted to be scraped
        molecule_extra_job: molecule-extra
        # paths the role must NOT have touched - the defaults it no longer uses
        unexpected_paths:
          - /data/ansible/vmagent
          - /data/vmagent
