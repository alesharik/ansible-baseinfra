---
- name: Create compose dir
  ansible.builtin.file:
    path: "{{ wg_exporter.directories.ansible }}"
    state: directory
    mode: "0755"
  tags: wg_exporter

- name: Move compose files
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ wg_exporter.directories.ansible }}/docker-compose.yml"
    mode: "0755"
  tags: wg_exporter
  notify:
    - restart wg exporter

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull wg exporter images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ wg_exporter.directories.ansible }}"
    policy: missing
  tags: wg_exporter

- name: Start wg exporter
  community.docker.docker_compose_v2:
    project_src: "{{ wg_exporter.directories.ansible }}"
    state: present
  tags: wg_exporter

- name: Make sure handlers are flushed immediately
  ansible.builtin.meta: flush_handlers
  tags: wg_exporter
