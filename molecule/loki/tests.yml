---
# --- defaults have not drifted from what this scenario pins ------------------
# loki-defaults deliberately does not set `loki` at all, so it runs the role
# defaults as published. The verify play does not include the role, so those
# defaults are not in scope here - the expectations are spelled out in host_vars,
# and this re-reads the file to prove they still match it.
- name: Read the role defaults from the controller
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/roles/loki/defaults/main.yaml"
  delegate_to: localhost
  become: false
  register: role_defaults_raw
  when: inventory_hostname == 'loki-defaults'

- name: Check the pinned expectations still equal the role defaults
  vars:
    role_defaults: "{{ role_defaults_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - role_defaults.loki.log_format == expected_log_format
      - role_defaults.loki.retention.retention_period == expected_retention_period
      - role_defaults.loki.retention.retention_stream == expected_retention_stream
      - role_defaults.loki.allow_structured_metadata == expected_allow_structured_metadata
      - not role_defaults.loki.migrate_from_v11
      - not role_defaults.loki.disable_default_network
      - role_defaults.loki.env == expected_env
      - role_defaults.loki.networks == []
    fail_msg: >-
      roles/loki/defaults/main.yaml has changed - the "defaults" host is running
      something else now
  when: inventory_hostname == 'loki-defaults'

# --- every directory in the var, and nothing outside it ----------------------
- name: Stat the directories the role should have created
  ansible.builtin.stat:
    path: "{{ item }}"
  register: loki_dirs
  loop:
    - "{{ expected_compose_dir }}"
    - "{{ expected_data_dir }}"
    - "{{ expected_config_dir }}"

- name: Check each directory exists
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    fail_msg: "{{ item.item }} is not a directory"
  loop: "{{ loki_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check the data dir is owned by the uid loki runs as
  vars:
    data_dir: "{{ loki_dirs.results | selectattr('item', 'eq', expected_data_dir) | first }}"
  ansible.builtin.assert:
    that:
      - data_dir.stat.uid == 10001
    fail_msg: "{{ expected_data_dir }} is owned by uid {{ data_dir.stat.uid }}, expected 10001"

# the whole point of the vars: a path still derived from dir.ansible/dir.data
# would show up here even though every assertion above passed
- name: Stat the default paths the role must no longer use
  ansible.builtin.stat:
    path: "{{ item }}"
  register: loki_default_paths
  loop: "{{ unexpected_paths | default([]) }}"

- name: Check the role wrote nothing outside loki.directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      {{ item.item }} exists - something in the role still derives its path from
      dir.ansible/dir.data instead of loki.directories
  loop: "{{ loki_default_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

# --- docker-compose.yml ------------------------------------------------------
- name: Read the rendered docker-compose.yml
  ansible.builtin.slurp:
    src: "{{ expected_compose_dir }}/docker-compose.yml"
  register: loki_compose_raw

- name: Check compose mounts the directories from the vars
  vars:
    compose: "{{ loki_compose_raw.content | b64decode | from_yaml }}"
    volumes: "{{ compose.services.loki.volumes }}"
  ansible.builtin.assert:
    that:
      - compose.services | list == ['loki']
      # deliberately unset: a hardcoded container_name is global to the daemon,
      # so it collides with anything else already holding the name and ignores
      # the project namespacing compose gives the container for free
      - compose.services.loki.container_name is not defined
      - "expected_data_dir ~ ':/var/lib/loki' in volumes"
      - "expected_config_dir ~ ':/etc/loki' in volumes"
      # the mount source is <ansible>/config and the config path is fixed on the
      # container's side, so a change to either has to move with the other
      - "'/etc/loki/config.yaml' in compose.services.loki.command"
    fail_msg: "compose mounts {{ volumes }} and runs {{ compose.services.loki.command }}"

- name: Check env reached the compose environment
  vars:
    compose: "{{ loki_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - compose.services.loki.environment | default([]) == expected_env
    fail_msg: >-
      compose environment is
      {{ compose.services.loki.environment | default('<unset>') }},
      expected {{ expected_env }}

# --- disable_default_network -------------------------------------------------
# loki-defaults names no networks and leaves the flag off, so the template must
# emit no top-level networks mapping at all. loki-custom was re-run by
# side_effect.yml with the flag on and one external network.
- name: Check no networks are declared when the flag is off
  vars:
    compose: "{{ loki_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - compose.networks is not defined
    fail_msg: >-
      compose declares networks {{ compose.networks | default({}) }} on a host
      that names none and leaves disable_default_network off
  when: not expect_network_mode_none

# spelled out rather than derived from loki.networks: an expectation built from
# the same var the template reads would agree with a broken template
- name: Check the flag points the default network at none
  vars:
    compose: "{{ loki_compose_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - "compose.networks['default'] == {'external': true, 'name': 'none'}"
      - "compose.networks['molecule-loki'] == {'external': true, 'name': 'molecule-loki'}"
      # the external network has to survive alongside default, not replace it -
      # a service left on the default network could not start at all
      - "compose.services.loki.networks == ['molecule-loki']"
    fail_msg: "compose networks are {{ compose.networks | default('<unset>') }}"
  when: expect_network_mode_none

# --- config.yaml -------------------------------------------------------------
- name: Read the rendered config.yaml
  ansible.builtin.slurp:
    src: "{{ expected_config_dir }}/config.yaml"
  register: loki_config_raw

- name: Check the vars reached the rendered config
  vars:
    config: "{{ loki_config_raw.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - config.server.log_format == expected_log_format
      - config.server.http_listen_port == molecule_http_port
      - config.limits_config.allow_structured_metadata == expected_allow_structured_metadata
      - config.limits_config.retention_period == expected_retention_period
      - config.limits_config.retention_stream == expected_retention_stream
      # the same var feeds both, and they used to be able to disagree
      - config.table_manager.retention_period == expected_retention_period
      # everything the data dir holds hangs off this, so it has to be the mount
      - config.common.path_prefix == '/var/lib/loki'
    fail_msg: "config.yaml rendered as {{ config }}"

# migrate_from_v11 prepends the boltdb-shipper period; the default host must not
# have it, and its absence is only meaningful if the other host proves it renders
- name: Check the schema periods match the migration setting
  vars:
    config: "{{ loki_config_raw.content | b64decode | from_yaml }}"
    configs: "{{ config.schema_config.configs }}"
  ansible.builtin.assert:
    that:
      - configs | map(attribute='schema') | list == expected_schemas
      - configs | map(attribute='from') | map('string') | list == expected_schema_from
      - configs | map(attribute='object_store') | unique | list == ['filesystem']
    fail_msg: >-
      schema_config holds
      {{ configs | map(attribute='schema') | list }} from
      {{ configs | map(attribute='from') | list }},
      expected {{ expected_schemas }} from {{ expected_schema_from }}

# --- the container actually runs the config it was handed --------------------
# The compose file sets no container_name, so the container is named after the
# project - which follows the compose dir and is not something the test can
# spell. Find it by the labels compose stamps on it instead; working_dir is the
# one that stays exact when the directories move.
- name: Find the loki container by its compose labels
  ansible.builtin.command: >-
    docker ps --quiet --no-trunc
    --filter label=com.docker.compose.project.working_dir={{ expected_compose_dir }}
    --filter label=com.docker.compose.service=loki
  register: loki_container_id
  changed_when: false
  retries: 30
  delay: 5
  until: loki_container_id.rc == 0 and loki_container_id.stdout_lines | length == 1

- name: Wait for the loki container to report running
  ansible.builtin.command: "docker inspect {{ loki_container_id.stdout_lines[0] }}"
  register: loki_inspect_raw
  changed_when: false
  retries: 30
  delay: 5
  # `and` short-circuits, so from_json never sees an empty stdout
  until: >-
    loki_inspect_raw.rc == 0 and
    (loki_inspect_raw.stdout | from_json)[0].State.Running

# the rendered file only proves the template; this proves docker acted on it
- name: Check docker bound the directories from the vars
  vars:
    binds: "{{ (loki_inspect_raw.stdout | from_json)[0].HostConfig.Binds }}"
    # docker appends the access mode, so a bind reads host:container:rw here
    bind_paths: "{{ binds | map('regex_replace', '^([^:]+:[^:]+).*$', '\\1') | list }}"
  ansible.builtin.assert:
    that:
      - "expected_data_dir ~ ':/var/lib/loki' in bind_paths"
      - "expected_config_dir ~ ':/etc/loki' in bind_paths"
    fail_msg: "docker bound {{ binds }}"

- name: Check the container joined the expected networks
  vars:
    nets: "{{ (loki_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks | list }}"
  ansible.builtin.assert:
    that:
      - nets == expected_networks
    fail_msg: "container is attached to {{ nets }}, expected {{ expected_networks }}"

- name: Check env reached the container environment
  vars:
    container_env: "{{ (loki_inspect_raw.stdout | from_json)[0].Config.Env }}"
  ansible.builtin.assert:
    that:
      - expected_env | difference(container_env) | length == 0
    fail_msg: "container environment is {{ container_env }}, expected it to carry {{ expected_env }}"

# --- loki answers, and serves the config it was given ------------------------
# loki publishes no ports, so this goes to the container's own address on
# whichever network it ended up attached to
- name: Read the container address
  vars:
    networks: "{{ (loki_inspect_raw.stdout | from_json)[0].NetworkSettings.Networks }}"
  ansible.builtin.set_fact:
    loki_ip: "{{ networks[expected_networks[0]].IPAddress }}"

- name: Wait for loki to report ready
  ansible.builtin.uri:
    url: "http://{{ loki_ip }}:{{ molecule_http_port }}/ready"
    return_content: true
    status_code: 200
  register: loki_ready
  retries: 30
  delay: 5
  until: loki_ready.status is defined and loki_ready.status == 200

# the file on disk only proves the template ran; this is loki reporting back the
# config it actually parsed. Durations are normalised on the way through, so the
# assertions here are the fields that survive a round trip unchanged - the exact
# retention strings are pinned against the rendered file above.
- name: Read the config loki parsed
  ansible.builtin.uri:
    url: "http://{{ loki_ip }}:{{ molecule_http_port }}/config"
    return_content: true
  register: loki_running_config

- name: Check loki is running the config the role wrote
  vars:
    config: "{{ loki_running_config.content | from_yaml }}"
  ansible.builtin.assert:
    that:
      - config.server.log_format == expected_log_format
      - config.common.path_prefix == '/var/lib/loki'
      - config.schema_config.configs | map(attribute='schema') | list == expected_schemas
      - not config.analytics.reporting_enabled
    fail_msg: >-
      loki parsed log_format {{ config.server.log_format | default('<unset>') }}
      and schemas {{ config.schema_config.configs | map(attribute='schema') | list }}

- name: Check loki serves its own metrics
  ansible.builtin.uri:
    url: "http://{{ loki_ip }}:{{ molecule_http_port }}/metrics"
    return_content: true
  register: loki_metrics

- name: Check the metrics endpoint answered with loki's own metrics
  ansible.builtin.assert:
    that:
      - "'loki_build_info' in loki_metrics.content"
    fail_msg: the metrics endpoint answered without loki's own metrics in it
