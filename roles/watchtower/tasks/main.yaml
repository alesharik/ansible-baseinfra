---
- name: Create compose dir
  ansible.builtin.file:
    path: "{{ watchtower.directories.ansible }}"
    state: directory
    mode: "0755"
  tags: watchtower

- name: Setup password
  tags: watchtower
  when: "watchtower.vmagent"
  block:
    - name: Read password
      tags: watchtower
      ansible.builtin.shell: |
        cat {{ watchtower.directories.ansible }}/http_password
      register: watchtower_http_token
      changed_when: false
      ignore_errors: true

    - name: Set password fact
      tags: watchtower
      ansible.builtin.set_fact:
        watchtower_http_token: "{{ watchtower_http_token.stdout }}"
      when: watchtower_http_token is defined

    - name: Generate password
      tags: watchtower
      ansible.builtin.set_fact:
        watchtower_http_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      when: not watchtower_http_token | default(None)

    - name: Write password
      ansible.builtin.copy:
        dest: "{{ watchtower.directories.ansible }}/http_password"
        content: "{{ watchtower_http_token }}"
        group: root
        owner: root
        mode: "0100"
      tags: watchtower
      notify:
        - restart watchtower

# The compose file bind-mounts this read-only for registry credentials. Nothing
# creates it - docker would silently materialise a *directory* at that path, and
# watchtower would then fail to parse its own config - so the mount is only
# emitted when a real file is already there.
- name: Check for the docker CLI config
  ansible.builtin.stat:
    path: /root/.docker/config.json
  register: watchtower_docker_config
  tags: watchtower

- name: Move compose files
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ watchtower.directories.ansible }}/docker-compose.yml"
    mode: "0755"
  tags: watchtower
  notify:
    - restart watchtower

# Owned by the vmagent role, which mounts it into its container - creating it
# here would leave a directory no vmagent ever reads. When it is missing the
# drop is skipped; deploying vmagent later and re-running this role fills it in.
- name: Check for the vmagent conf.d directory
  ansible.builtin.stat:
    path: "{{ watchtower.directories.vmagent }}"
  register: watchtower_vmagent_conf_d
  when: "watchtower.vmagent"
  tags: watchtower

- name: Move vmagent config
  when:
    - watchtower.vmagent
    - watchtower_vmagent_conf_d.stat.isdir | default(false)
  ansible.builtin.template:
    src: vmagent.yaml
    dest: "{{ watchtower.directories.vmagent }}/watchtower.yml"
    mode: "0755"
  tags: watchtower

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull watchtower images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ watchtower.directories.ansible }}"
    policy: missing
  tags: watchtower

- name: Start watchtower
  community.docker.docker_compose_v2:
    project_src: "{{ watchtower.directories.ansible }}"
    state: present
  tags: watchtower

- name: Clear password fact
  tags: watchtower
  ansible.builtin.set_fact:
    watchtower_http_token: ""
  when: watchtower_http_token is defined

- name: Make sure handlers are flushed immediately
  ansible.builtin.meta: flush_handlers
  tags: watchtower
