---
- name: Check the postgres settings
  tags: postgres
  ansible.builtin.include_tasks: assert.yaml

- name: Work out the major version
  tags: postgres
  ansible.builtin.set_fact:
    postgres_major: "{{ postgres.version | string | regex_search('^[0-9]+') }}"

# The community.postgresql modules run on this host.
- name: Install psycopg2
  tags: postgres
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present

- name: Create compose dir
  tags: postgres
  ansible.builtin.file:
    path: "{{ postgres.directories.ansible }}"
    state: directory
    mode: "0755"

- name: Create config dir
  tags: postgres
  ansible.builtin.file:
    path: "{{ postgres.directories.ansible }}/config"
    state: directory
    mode: "0755"

# Only with packages. The image tag carries a hash of this file, so a package
# change gives a new tag and compose builds it.
- name: Move the Dockerfile
  tags: postgres
  ansible.builtin.template:
    src: Dockerfile
    dest: "{{ postgres.directories.ansible }}/Dockerfile"
    mode: "0444"
  when: postgres.packages | length > 0

# stat, not the checksum the template task returns: stat gives the same value on
# a changed run and on an unchanged one.
- name: Read the Dockerfile checksum
  tags: postgres
  ansible.builtin.stat:
    path: "{{ postgres.directories.ansible }}/Dockerfile"
    checksum_algorithm: sha1
  register: postgres_dockerfile
  when: postgres.packages | length > 0

- name: Work out the image tag
  tags: postgres
  ansible.builtin.set_fact:
    postgres_build_tag: "{{ postgres_dockerfile.stat.checksum[:12] }}"
  when: postgres.packages | length > 0

# Mounted at /var/run/postgresql. The entrypoint sets 3775 and uid 999 on it at
# every start, so anything else here would flip back and forth between runs.
- name: Create socket dir
  tags: postgres
  ansible.builtin.file:
    path: "{{ postgres.directories.ansible }}/run"
    state: directory
    mode: "3775"
    owner: "999"
    group: "999"

# 999 is the postgres user of the image. The standby base backup runs as that
# uid and has to create <major>/docker in here.
- name: Create data dir
  tags: postgres
  ansible.builtin.file:
    path: "{{ postgres.directories.data }}"
    state: directory
    mode: "0700"
    owner: "999"
    group: "999"

# No secrets in it, so readable by everyone - the server reads it as uid 999.
- name: Move pg_hba.conf
  tags: postgres
  ansible.builtin.template:
    src: pg_hba.conf
    dest: "{{ postgres.directories.ansible }}/config/pg_hba.conf"
    mode: "0444"

- name: Move compose files
  tags: postgres
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ postgres.directories.ansible }}/docker-compose.yml"
    mode: "0700"

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull postgres images
  tags: postgres
  community.docker.docker_compose_v2_pull:
    project_src: "{{ postgres.directories.ansible }}"
    policy: missing
    # The built image is local only, and `docker build` pulls its own base. The
    # exporter is not buildable, so it is still pulled.
    ignore_buildable: true

- name: Read the data dir
  tags: postgres
  ansible.builtin.include_tasks:
    file: data_state.yaml

- name: Upgrade the cluster
  tags: postgres
  ansible.builtin.include_tasks:
    file: upgrade.yaml
  when: postgres_upgrade_from | int > 0

- name: Seed the standby
  tags: postgres
  ansible.builtin.include_tasks:
    file: standby.yaml
  when:
    - postgres.mode == 'standby'
    - postgres_clusters | length == 0

# remove_orphans so that turning the exporter off takes its container down.
- name: Start postgres
  tags: postgres
  community.docker.docker_compose_v2:
    project_src: "{{ postgres.directories.ansible }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 600

- name: Reload pg_hba.conf when it changed
  tags: postgres
  ansible.builtin.include_tasks:
    file: hba_reload.yaml

# upgrade.yaml leaves this marker, so a run that fails between the upgrade and
# here still analyzes on the next run. pg_upgrade carries the planner statistics
# over only from 18 on, and even then not all of them.
- name: Look for a pending analyze
  tags: postgres
  ansible.builtin.stat:
    path: "{{ postgres.directories.data }}/{{ postgres_major }}/analyze_pending"
  register: postgres_analyze_pending

# The password comes from the container environment, so it stays out of this
# host's process list.
- name: Refresh planner statistics after the upgrade
  tags: postgres
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ postgres.directories.ansible }}"
      - exec
      - -T
      - postgres
      - sh
      - -c
      - >-
        PGPASSWORD="$POSTGRES_PASSWORD"
        exec vacuumdb --username "$POSTGRES_USER" --all --analyze-in-stages
        {{ '--missing-stats-only' if postgres_major | int >= 18 else '' }}
  changed_when: true
  when: postgres_analyze_pending.stat.exists

- name: Clear the pending analyze
  tags: postgres
  ansible.builtin.file:
    path: "{{ postgres.directories.data }}/{{ postgres_major }}/analyze_pending"
    state: absent
  when: postgres_analyze_pending.stat.exists

# A standby is read-only: everything below replicates from its primary.
- name: Manage roles and databases
  tags: postgres
  ansible.builtin.include_tasks:
    file: manage.yaml
  when: postgres.mode != 'standby'

- name: Make sure handlers are flushed immediately
  tags: postgres
  ansible.builtin.meta: flush_handlers
