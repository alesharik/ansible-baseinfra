---
- name: Create peer private key
  tags: etcd
  community.crypto.openssl_privatekey:
    path: "{{ etcd.directories.ansible }}/config/peer.key"
    owner: '10010'
    mode: "0400"

- name: Create peer certificate signing request (CSR) for new certificate
  tags: etcd
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ etcd.directories.ansible }}/config/peer.key"
    # See gen-cert-server.yaml: an empty subject needs a critical SAN to be a
    # valid certificate, so name the member instead.
    common_name: "{{ ansible_hostname }}"
    organization_name: "{{ etcd.pki.organization }}"
    organizational_unit_name: "{{ etcd.pki.organizational_unit }}"
    use_common_name_for_san: false
    subject_alt_name: "IP:{{ etcd.peer_ip }}"
  register: etcd_peer_csr
  # See gen-cert-server.yaml: a _pipe module writes nothing, so it has no state
  # to have changed.
  changed_when: false

# See gen-cert-server.yaml: without `content` the pipe module regenerates the
# certificate on every run and the role never reaches idempotence.
- name: Read the existing peer certificate
  ansible.builtin.slurp:
    src: "{{ etcd.directories.ansible }}/config/peer.cer"
  register: etcd_peer_certificate_existing
  failed_when: false
  changed_when: false
  tags: etcd

- name: Sign peer certificate with our CA
  tags: etcd
  become: false
  delegate_to: 127.0.0.1
  vars:
    ansible_remote_tmp: "{{ playbook_dir }}/tmp"
  community.crypto.x509_certificate_pipe:
    content: >-
      {{ (etcd_peer_certificate_existing.content | b64decode)
         if etcd_peer_certificate_existing.content is defined else omit }}
    csr_content: "{{ etcd_peer_csr.csr }}"
    provider: ownca
    ownca_path: "{{ etcd.directories.ca }}/ca.pem"
    ownca_privatekey_path: "{{ etcd.directories.ca }}/ca.key"
    ownca_not_after: +365d  # valid for one year
    ownca_not_before: "-1d"  # valid since yesterday
  register: etcd_peer_certificate

- name: Write peer certificate
  ansible.builtin.copy:
    dest: "{{ etcd.directories.ansible }}/config/peer.cer"
    content: "{{ etcd_peer_certificate.certificate }}"
    owner: '10010'
    mode: "0444"
  tags: etcd
  notify:
    - restart etcd
