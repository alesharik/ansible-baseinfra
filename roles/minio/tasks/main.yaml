---
- name: Create compose dir
  ansible.builtin.file:
    path: "{{ dir.ansible }}/minio"
    state: directory
    mode: 0755
  tags: minio
- name: Move compose files
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ dir.ansible }}/minio/docker-compose.yml"
    mode: 0755
  tags: minio
  notify:
    - restart minio
- name: Move env file
  ansible.builtin.template:
    src: .env
    dest: "{{ dir.ansible }}/minio/.env"
    mode: 0755
  tags: minio
  notify:
    - restart minio
- name: Create minio directory
  ansible.builtin.file:
    path: "{{ dir.data }}/minio"
    state: directory
    mode: 0755
  tags: minio

- name: Configure nginx-proxy
  tags: minio
  include_tasks:
    file: vhost.yaml
  loop: "{{ minio.hosts }}"
  loop_control:
    loop_var: domain

# Pull separately: on an up that also pulls, compose 5.4.0 labels the container
# with the local image ID, then recreates it once on the next up.
- name: Pull minio images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ dir.ansible }}/minio"
    policy: missing
  tags: minio

- name: Start minio
  community.docker.docker_compose_v2:
    project_src: "{{ dir.ansible }}/minio"
    state: present
  tags: minio

- name: Make sure handlers are flushed immediately
  ansible.builtin.meta: flush_handlers
  tags: minio
