---
# Two platforms on purpose: the same image twice, differing only in how
# `traefik.entrypoints` and `traefik.listen_ips` are set. One host pins what
# roles/traefik/defaults/main.yaml is supposed to produce, the other proves both
# vars reach traefik and docker unchanged. The shared converge.yml includes the
# role by scenario name, so a second scenario is not an option - a scenario is a
# role name here.
platforms:
  - name: traefik-defaults
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    # This scenario runs docker inside the instance, and overlayfs refuses to
    # stack on overlayfs: without a real filesystem under the image store, the
    # inner daemon fails every pull with "invalid argument" on the overlay
    # mount. Anonymous volumes are host-backed, which is enough. Docker >= 25
    # keeps snapshots in containerd, older ones in /var/lib/docker - mount both
    # so this does not depend on which one the instance installs.
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    # anonymous volumes are kept by default; nothing here should outlive destroy
    keep_volumes: false
  - name: traefik-custom
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice
    volumes:
      - /var/lib/docker
      - /var/lib/containerd
    keep_volumes: false

provisioner:
  inventory:
    group_vars:
      all:
        # traefik's meta pulls in bootstrap, so this scenario has to satisfy it.
        # `bootstrap` is a plain dict override - it replaces the role defaults
        # wholesale, so every key the role reads has to be listed here.
        bootstrap:
          # would reach the host kernel through the privileged container
          disable_algif_aead: false
          disable_transparent_huge_pages: false
          # nothing under test here needs users or sudoers
          setup_users: false
          setup_sudo: false
          set_hostname: true
          limits:
            enabled: true
            nofile:
              soft: 8192
              hard: 1048576
          swap:
            enabled: false
            # NOT /swapfile: /proc/swaps is not namespaced, so teardown-swap.yaml
            # would match the docker *host's* active swap and swapoff a file this
            # container never activated. See molecule/bootstrap/molecule.yml.
            file: /molecule_swapfile
            size_mb: 4096
        dir:
          data: /data
          ansible: /data/ansible
    # expected_* is what tests.yml asserts against, spelled out per host rather
    # than derived from `traefik`. Deriving the expectation from the same var the
    # templates read would let a broken template agree with a broken test.
    host_vars:
      traefik-defaults:
        # `traefik` is a wholesale dict override, so a host cannot inherit the
        # role defaults for some keys and redirect directories.configs for
        # others - the values below are the role defaults, copied. tests.yml
        # asserts they still equal roles/traefik/defaults/main.yaml, so this
        # copy cannot silently drift away from what it claims to pin.
        traefik:
          image: traefik
          version: "v3.6.15"
          entrypoints:
            web:
              address: :80
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
                    permanent: true
            websecure:
              address: ":443"
              http:
                tls: { }
          listen_ips:
            - "0.0.0.0:443:443"
            - "0.0.0.0:80:80"
          networks: []
          env: []
          directories:
            # NOT the role default of {{ playbook_dir }}/traefik: playbook_dir is
            # molecule/ here, so the default would template this scenario's own
            # molecule.yml and tests.yml into confs/
            configs: "{{ playbook_dir }}/traefik/fixtures/confs"
            ansible: "{{ dir.ansible }}/traefik"
            acme: "{{ dir.data }}/traefik-acme"
        expected_entrypoints:
          web:
            address: ":80"
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            address: ":443"
            http:
              tls: {}
        expected_listen_ips:
          - "0.0.0.0:443:443"
          - "0.0.0.0:80:80"
        # container port -> the host address docker is expected to bind
        expected_bindings:
          80/tcp: 0.0.0.0:80
          443/tcp: 0.0.0.0:443
        # which entrypoint the fixture router attaches to, and how to reach it
        molecule_tls_entrypoint: websecure
        molecule_http_port: 80
        molecule_tls_port: 443
      traefik-custom:
        traefik:
          image: traefik
          version: "v3.6.15"
          entrypoints:
            http:
              address: ":8000"
              http:
                redirections:
                  entryPoint:
                    to: https
                    scheme: https
                    permanent: true
            https:
              address: ":8443"
              http:
                tls: { }
              # no default sets this, so it only renders if entrypoints really
              # are passed through untouched
              forwardedHeaders:
                insecure: true
            # deliberately absent from listen_ips - traefik listens, docker
            # publishes nothing
            internal:
              address: ":9100"
          # host port != container port, so a mapping that dropped either half
          # of the pair would show up
          listen_ips:
            - "127.0.0.1:8001:8000"
            - "127.0.0.1:8444:8443"
          networks: []
          env: []
          directories:
            configs: "{{ playbook_dir }}/traefik/fixtures/confs"
            ansible: "{{ dir.ansible }}/traefik"
            acme: "{{ dir.data }}/traefik-acme"
        expected_entrypoints:
          http:
            address: ":8000"
            http:
              redirections:
                entryPoint:
                  to: https
                  scheme: https
                  permanent: true
          https:
            address: ":8443"
            http:
              tls: {}
            forwardedHeaders:
              insecure: true
          internal:
            address: ":9100"
        expected_listen_ips:
          - "127.0.0.1:8001:8000"
          - "127.0.0.1:8444:8443"
        expected_bindings:
          8000/tcp: 127.0.0.1:8001
          8443/tcp: 127.0.0.1:8444
        molecule_tls_entrypoint: https
        molecule_http_port: 8001
        molecule_tls_port: 8444
